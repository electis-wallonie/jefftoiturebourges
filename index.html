<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing Strategy Exam Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: mind map = root in the middle, 3 branches each side, leaves fan out; details open in a side drawer. Quiz = one card at a time. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#eef1f8; --ink:#141829; --muted:#586079; --line:#d6dbe8;
  --accent:#2f54d4; --good:#16865a; --good-t:#e3f5ec; --bad:#c62f3f; --bad-t:#fbe7ea; --warn:#9a6200; --warn-t:#fdf1d8;
  --c1:#2f63d8; --c1-t:#e5ecfc; --c2:#0d8a6a; --c2-t:#dff3ec; --c3:#c46a12; --c3-t:#fbeedd;
  --c4:#be2f68; --c4-t:#fbe4ee; --c5:#6b46cf; --c5-t:#ece6fb; --c6:#8a7206; --c6-t:#f6f0d4;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2d; --surface2:#1e2338; --ink:#e7eaf5; --muted:#9aa2bd; --line:#2c3352;
  --accent:#8ea6ff; --good:#4fd39a; --good-t:#123326; --bad:#ff7d8a; --bad-t:#3a1820; --warn:#f2c060; --warn-t:#352a10;
  --c1:#7ea3ff; --c1-t:#1c2647; --c2:#4fd1ac; --c2-t:#123129; --c3:#f3a35a; --c3-t:#35260f;
  --c4:#ff7fae; --c4-t:#3a1527; --c5:#b39aff; --c5-t:#271d45; --c6:#e0c64f; --c6-t:#2f2a0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b2d; --surface2:#1e2338; --ink:#e7eaf5; --muted:#9aa2bd; --line:#2c3352;
  --accent:#8ea6ff; --good:#4fd39a; --good-t:#123326; --bad:#ff7d8a; --bad-t:#3a1820; --warn:#f2c060; --warn-t:#352a10;
  --c1:#7ea3ff; --c1-t:#1c2647; --c2:#4fd1ac; --c2-t:#123129; --c3:#f3a35a; --c3-t:#35260f;
  --c4:#ff7fae; --c4-t:#3a1527; --c5:#b39aff; --c5-t:#271d45; --c6:#e0c64f; --c6-t:#2f2a0e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.top{max-width:1320px;margin:0 auto;padding-block:22px 10px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.top h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.top .sub{color:var(--muted);margin-top:6px;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wrap{max-width:1320px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px 14px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1120}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1120}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.progress{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
/* importance dots */
.imp{display:inline-flex;gap:2px;flex:none}
.imp i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.imp.i3 i{background:var(--bc,var(--ink))}
.imp.i2 i:nth-child(-n+2){background:var(--bc,var(--ink))}
.imp.i1 i:nth-child(1){background:var(--bc,var(--ink))}
/* map */
.mm-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 18px}
.mm{position:relative;display:grid;gap:0 40px;align-items:center;margin:0 auto;width:max-content}
.mm svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.mm.two{grid-template-columns:auto auto auto}
.mm.two .side-l{grid-column:1;grid-row:1}
.mm.two .root{grid-column:2;grid-row:1}
.mm.two .side-r{grid-column:3;grid-row:1}
.mm.one{grid-template-columns:auto auto}
.mm.one .root{grid-column:1;grid-row:1 / span 2}
.mm.one .side-r{grid-column:2;grid-row:1}
.mm.one .side-l{grid-column:2;grid-row:2}
.side{display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.root{position:relative;z-index:1;background:var(--ink);color:var(--bg);border-radius:18px;padding:18px 20px;width:190px;text-align:center}
.root h2{font-size:22px;line-height:1.1;font-weight:800}
.root p{margin:6px 0 0;font-size:12px;opacity:.75;font-family:var(--f-mono)}
.br-row{display:flex;align-items:center;gap:36px}
.mm.two .side-l .br-row{flex-direction:row-reverse}
.br-node{width:178px;flex:none;text-align:left;border:2px solid var(--bc);background:var(--bt);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.br-node .wk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bc);font-weight:600}
.br-node .bt{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15}
.br-node .cnt{font-size:11.5px;color:var(--muted)}
.kids{display:flex;flex-direction:column;gap:5px}
.br-row.collapsed .kids{display:none}
.leaf{width:250px;text-align:left;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px;line-height:1.25;cursor:pointer;transition:border-color .15s,transform .15s}
.leaf:hover{border-color:var(--bc);transform:translateX(2px)}
.mm.two .side-l .leaf:hover{transform:translateX(-2px)}
.leaf .lt{flex:1;min-width:0}
.leaf .ok{font-size:12px;color:var(--good);font-weight:700;visibility:hidden}
.leaf.known .ok{visibility:visible}
.leaf.known{background:var(--good-t)}
.leaf.dim,.br-row.dim .br-node{opacity:.28}
.leaf.hit{border-color:var(--bc);box-shadow:0 0 0 2px var(--bt)}
.leaf.active{border-color:var(--bc);box-shadow:0 0 0 3px var(--bc)}
/* outline (phone) */
.mm.outline{display:block;width:auto}
.mm.outline .root{width:auto;margin-bottom:18px}
.mm.outline .side{gap:16px}
.mm.outline .side + .side{margin-top:16px}
.mm.outline .br-row{flex-direction:column;align-items:stretch;gap:8px}
.mm.outline .br-node{width:auto}
.mm.outline .kids{border-left:2px solid var(--bc);margin-left:14px;padding-left:12px}
.mm.outline .leaf{width:auto}
.mm.outline svg.lines{display:none}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
  box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.dr-meta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--bc);font-weight:600}
.dr-head h3{font-size:22px;line-height:1.15}
.dr-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px}
.dr-body{overflow-y:auto;padding:16px 20px 24px;flex:1;font-size:14.5px}
.dr-body p{margin:0 0 10px}
.dr-body ul,.dr-body ol{margin:0 0 12px;padding-left:20px}
.dr-body li{margin-bottom:4px}
.dr-body h4{font-family:var(--f-display);font-size:15px;margin:16px 0 6px}
.dr-body .k{font-weight:700}
.dr-body .def{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.trap{background:var(--warn-t);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13.5px}
.trap::before{content:"EXAM TRAP";display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;font-weight:600;color:var(--warn);margin-bottom:3px}
.tip{background:var(--bt,var(--surface2));border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13.5px}
.tip::before{content:"MEMORY HOOK";display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;font-weight:600;color:var(--bc,var(--accent));margin-bottom:3px}
.tbw{overflow-x:auto;margin:0 0 12px}
table.tb{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
table.tb th,table.tb td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.tb th{background:var(--surface2);font-weight:600}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}
.seq span{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.seq b{color:var(--muted);font-weight:400}
.dr-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.scrim{position:fixed;inset:0;background:rgba(10,12,25,.35);z-index:40}
/* quiz */
.qz{max-width:820px;margin:0 auto}
.qz-setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px}
.qz-setup h2{font-size:24px}
.qz-setup .row{display:grid;gap:8px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--bc);background:var(--bt);padding:3px 8px;border-radius:6px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:var(--good-t)}
.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface2)}
.expl strong{display:block;margin-bottom:3px}
.expl.ok strong{color:var(--good)} .expl.ko strong{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.res h2{font-size:30px}
.big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1}
.topicbars{display:grid;gap:8px;margin:16px 0}
.tbar{display:grid;grid-template-columns:minmax(0,190px) 1fr 60px;gap:10px;align-items:center;font-size:13px}
.tbar .t{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.tbar .t i{display:block;height:100%;background:var(--bc)}
.tbar .n{font-family:var(--f-mono);text-align:right}
.miss{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.miss .mq{font-weight:600;margin-bottom:4px}
.miss .ma{color:var(--good);font-weight:600}
@media (max-width:640px){.qcard,.qz-setup{padding:16px}.qtext{font-size:16px}.tbar{grid-template-columns:1fr 70px}.tbar .t{grid-column:1 / -1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Marketing Strategy — Exam Map</h1>
    <div class="sub">All four decks: Strategic thinking · Opportunities &amp; environment · Segmentation &amp; targeting · Positioning · Branding · Packaging</div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-map" aria-selected="true">Mind map</button>
    <button role="tab" id="tab-quiz" aria-selected="false">Hard quiz</button>
  </div>
</header>

<main class="wrap">
  <section id="view-map">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="Search any concept (e.g. SOM, reflection, Chipotle, PESTELE)…" aria-label="Search the map"></div>
      <div class="chips" id="impf">
        <button class="chip" data-imp="1" aria-pressed="true">Everything</button>
        <button class="chip" data-imp="2" aria-pressed="false">Important +</button>
        <button class="chip" data-imp="3" aria-pressed="false">Must-know only</button>
      </div>
      <button class="btn" id="traps">All exam traps</button>
      <button class="btn" id="toggleAll">Collapse all</button>
    </div>
    <div class="toolbar" style="padding-top:0">
      <div class="legend">
        <span><span class="imp i3" style="--bc:var(--ink)"><i></i><i></i><i></i></span> must-know</span>
        <span><span class="imp i2" style="--bc:var(--ink)"><i></i><i></i><i></i></span> important</span>
        <span><span class="imp i1" style="--bc:var(--ink)"><i></i><i></i><i></i></span> detail</span>
        <span>Click a branch to fold it · click a topic for full notes</span>
      </div>
      <span class="progress" id="prog"></span>
    </div>
    <div class="mm-scroll"><div class="mm two" id="mm">
      <svg class="lines" id="lines"></svg>
      <div class="side side-l" id="sideL"></div>
      <div class="root"><h2>Marketing Strategy</h2><p>Midterm · weeks 2–7</p></div>
      <div class="side side-r" id="sideR"></div>
    </div></div>
  </section>

  <section id="view-quiz" hidden>
    <div class="qz" id="qz"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-live="polite">
  <button class="dr-x" id="drx" aria-label="Close">×</button>
  <div class="dr-head" id="drHead"></div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot" id="drFoot"></div>
</aside>

<script>
/* ======================= MIND MAP DATA ======================= */
const BR = [
{id:"strat", c:"c1", week:"Week 2", name:"Marketing & Strategic Thinking", side:"R", nodes:[
{id:"def", t:"What is marketing strategy?", imp:3, h:`
<div class="def"><span class="k">Marketing strategy</span> = “a business's overall <span class="k">game plan</span> for reaching prospective consumers and <span class="k">turning them into customers</span> of their products.” (Investopedia definition used in class)</div>
<p>The strategy is <span class="k">also called the marketing plan</span> — in the wheel diagram the arrow “Also called Marketing Plan” points to the <span class="k">Execution Plan</span> step.</p>
<p>Course textbooks: <span class="k">Ferrell, Hartline &amp; Hochstein</span> – <i>Marketing Strategy: Text and Cases</i> (8e, Cengage) and <span class="k">George S. Day</span> – <i>Advanced Introduction to Marketing Strategy</i> (Elgar).</p>`},
{id:"orient", t:"Orientation towards the marketplace (5 concepts)", imp:3, h:`
<div class="seq"><span>Production</span><b>→</b><span>Product</span><b>→</b><span>Selling</span><b>→</b><span>Marketing</span><b>→</b><span>Holistic marketing</span></div>
<div class="tbw"><table class="tb"><tr><th>Concept</th><th>Core idea (slide wording)</th></tr>
<tr><td>Production concept</td><td>Emphasis on <b>producing goods</b> (availability, efficiency)</td></tr>
<tr><td>Product concept</td><td>Producing <b>quality goods</b></td></tr>
<tr><td>Selling concept</td><td><b>Aggressive selling &amp; promotion</b></td></tr>
<tr><td>Marketing concept</td><td><b>Right products for customers</b> (start from needs)</td></tr>
<tr><td>Holistic marketing concept</td><td><b>Do everything possible</b> (integrated, whole-company view)</td></tr></table></div>
<div class="trap">“Producing goods” = Production concept; “producing <i>quality</i> goods” = Product concept. Selling comes <b>after</b> Product and <b>before</b> Marketing.</div>
<div class="tip">P-P-S-M-H: “<b>P</b>lease <b>P</b>ush <b>S</b>ales, <b>M</b>arket <b>H</b>olistically.”</div>`},
{id:"decades", t:"Evolution of marketing by decade (80s → 20s)", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>Decade</th><th>What the customer does</th></tr>
<tr><td>1980s</td><td>Customers <b>pay attention to your ads</b></td></tr>
<tr><td>1990s</td><td>“If we create the <b>website</b>, customers will come to us.”</td></tr>
<tr><td>2000s</td><td>Customer wants to <b>become our friends and like us on Facebook</b></td></tr>
<tr><td>2010s</td><td>Customer wishes to <b>follow us using their personal details</b></td></tr>
<tr><td>2020s</td><td>Customer wants to <b>hang out with our brand in the virtual world</b> (VR / metaverse)</td></tr></table></div>
<div class="trap">Facebook “like” = 2000s, not 2010s. “Personal details” (data-driven following) = 2010s.</div>`},
{id:"pushpull", t:"Marketing-Evolution timeline: push → pull", imp:2, h:`
<p>Long-run shift from <span class="k">PUSH marketing (above-the-line)</span> to <span class="k">PULL marketing (below-the-line)</span>.</p>
<h4>Orientations in order (1950 → 2020)</h4>
<div class="seq"><span>Product (1950)</span><b>→</b><span>Distribution (1960)</span><b>→</b><span>Market (1970)</span><b>→</b><span>Competitive (1980)</span><b>→</b><span>Environment (1990)</span><b>→</b><span>Performance + Dialog (2000)</span><b>→</b><span>Network (2010)</span><b>→</b><span>Below-the-line &amp; Content (2020)</span></div>
<h4>Channel families (left → right on the chart)</h4>
<ul>
<li><b>Advertising &amp; Sponsoring</b>: print, radio, TV advertising, sponsoring</li>
<li><b>Below-the-line (offline)</b>: PR, event marketing, product placement</li>
<li><b>Online Marketing 1.0 (push advertising)</b>: display advertising according to <b>TKP</b> (cost per thousand contacts ≈ CPM), e-mail marketing</li>
<li><b>Online Marketing 2.0 (performance marketing)</b>: display advertising according to <b>CPC</b>, SEO, SEA, e-mail, affiliate marketing</li>
<li><b>Social-media marketing</b>: social-network marketing</li>
<li><b>Below-the-line (online)</b>: content marketing, viral marketing, word-of-mouth marketing</li></ul>
<div class="trap">PR, events and product placement are <b>below-the-line</b> (offline), not above-the-line. Performance marketing is priced by <b>CPC</b>; Online Marketing 1.0 by <b>TKP</b> (per thousand contacts).</div>`},
{id:"mix", t:"Marketing mix: 4P → 7P → 9P", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Model</th><th>Elements</th></tr>
<tr><td><b>4P</b></td><td>Product, Price, Place, Promotion</td></tr>
<tr><td><b>7P</b> (+3)</td><td>4P + <b>People, Physical Evidence, Processes</b></td></tr>
<tr><td><b>9P</b> (+2)</td><td>7P + <b>Packaging, Public Relations</b></td></tr></table></div>
<div class="trap">9P adds exactly <b>Packaging</b> and <b>Public Relations</b> — not “Positioning”, “Partnerships” or “Purpose”. The 7P extension is the services mix.</div>`},
{id:"wheel", t:"Services mix wheel (what sits under each P)", imp:2, h:`
<p>Customer at the centre, 7 Ps around it:</p>
<div class="tbw"><table class="tb">
<tr><th>P</th><th>Items on the slide</th></tr>
<tr><td>Product</td><td>Total service product, core product, supplementary services, facilitating services, supporting services</td></tr>
<tr><td>Price</td><td>Cost-based, demand-based, operations-based, competition-based, relationship-based</td></tr>
<tr><td>Place</td><td>Access, location, delivery services, electronic delivery</td></tr>
<tr><td>Promotion</td><td><b>Internal marketing</b>, direct marketing, advertising, other promotional methods</td></tr>
<tr><td>People</td><td>Customers, employees, social interactions, <b>roles &amp; scripts</b>, relationships</td></tr>
<tr><td>Physical evidence</td><td>Facilities &amp; equipment, uniforms, livery &amp; artefacts, signage, symbols</td></tr>
<tr><td>Process</td><td>Service design, standardization, customization, operational efficiency</td></tr></table></div>
<div class="trap">“Internal marketing” is listed under <b>Promotion</b>, not People. “Roles &amp; scripts” is <b>People</b>, not Process. “Uniforms” is <b>Physical evidence</b>. “Supplementary services” is <b>Product</b>.</div>`},
{id:"swheel", t:"Marketing strategy wheel (7 steps)", imp:3, h:`
<div class="seq"><span>1 Understand customer / identify potential customers</span><b>→</b><span>2 Analyze market</span><b>→</b><span>3 Analyze competition</span><b>→</b><span>4 Define marketing mix</span><b>→</b><span>5 Determine market position</span><b>→</b><span>6 Marketing budget</span><b>→</b><span>7 Execution plan</span></div>
<p>The execution plan is “also called <b>marketing plan</b>”.</p>
<div class="trap">On this wheel the mix is defined <b>before</b> the market position, and the budget comes <b>right after</b> the position and <b>right before</b> the execution plan.</div>`},
{id:"eight", t:"8-step marketing strategy process", imp:2, h:`
<div class="seq"><span>1 Go through your existing marketing plan</span><b>→</b><span>2 Perform marketing research</span><b>→</b><span>3 Develop value proposition</span><b>→</b><span>4 Set marketing goals</span><b>→</b><span>5 Define marketing strategies</span><b>→</b><span>6 Define marketing mix</span><b>→</b><span>7 Marketing plan</span><b>→</b><span>8 Review &amp; reassess</span> <b>↺</b></div>
<div class="trap">Here the value proposition comes <b>before</b> goals, and strategies come <b>before</b> the mix. It is a loop: review &amp; reassess feeds back into step 1.</div>`},
{id:"mdev", t:"Benefits of a market development strategy", imp:1, h:`
<p>Six benefits on the slide:</p>
<ol><li>Improves product quality</li><li>Acquires new users</li><li>Up-sells current users</li><li>Helps to develop new products</li><li>Increases revenue margins</li><li>Helps to lessen production cost per unit</li></ol>
<div class="trap">“Reduces dependence on intermediaries” or “guarantees market leadership” are NOT on the list.</div>`},
{id:"course", t:"Course facts (assessment, project)", imp:1, h:`
<ul><li>Assessment: participation &amp; in-class activities <b>15%</b>, midterm <b>25%</b>, final exam <b>40%</b>, final group project <b>20%</b>.</li>
<li>AI content must not exceed <b>20%</b> of any assignment (checked via Turnitin and Quillbot).</li>
<li>Group project: 5–7 members, strategic marketing plan for a brand of choice — market analysis, target audience, 4P strategies, AI-powered solutions, “What are their mistakes in marketing? Offer a solution.” Uses a <b>SWOT</b>. Poster + visual board at a Project Fair, <b>5-minute</b> pitch, 10 Dec. Late = 20-point deduction.</li>
<li>Midterm: 12 Nov (week 8). Topics covered in class but not in the book are also examinable.</li></ul>`}
]},
{id:"env", c:"c2", week:"Week 3", name:"Market Opportunities & Environment", side:"R", nodes:[
{id:"cycle", t:"Marketing process cycle (8 steps around the consumer)", imp:2, h:`
<div class="seq"><span>1 Market research</span><b>→</b><span>2 Product development</span><b>→</b><span>3 Promotion</span><b>→</b><span>4 Sales</span><b>→</b><span>5 Distribution</span><b>→</b><span>6 Customer feedback</span><b>→</b><span>7 Analysis</span><b>→</b><span>8 Adjustment</span><b>↺</b></div>
<div class="trap">Promotion comes <b>before</b> Sales, and Distribution <b>after</b> Sales in this cycle. Analysis sits between feedback and adjustment.</div>`},
{id:"envlayers", t:"Marketing environment: internal · micro · macro", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Layer</th><th>Contents</th></tr>
<tr><td><b>Internal</b> (centre)</td><td>The company itself</td></tr>
<tr><td><b>Micro</b> (middle ring)</td><td>Suppliers, customers, competitors, intermediaries, distributors, publics</td></tr>
<tr><td><b>Macro</b> (outer ring)</td><td>Technological, social/cultural, demographic, environmental, economic, political/legal</td></tr></table></div>
<div class="tip">Micro = actors with names you can phone (a supplier, a distributor). Macro = forces nobody controls (inflation, a law, a demographic shift).</div>
<div class="trap">Competitors and publics are <b>micro</b>. Demographic is <b>macro</b>.</div>`},
{id:"opp", t:"Market opportunity: definition + 4 types", imp:3, h:`
<div class="def">A <span class="k">market opportunity</span> is a need or want for a product, service, or feature that is either <b>not being met</b> or is <b>underserved</b>. Identifying one lets you launch new offerings or improve existing ones, which may boost sales and profits.</div>
<h4>Four types</h4>
<ol><li><b>Untapped or underserved audience</b></li><li><b>Technological innovations</b></li><li><b>Societal changes</b></li><li><b>Regulatory interventions</b></li></ol>
<div class="trap">A new law that forces demand (e.g. mandatory EV chargers) = <b>regulatory intervention</b>, not a societal change.</div>`},
{id:"whymoa", t:"Why run a market opportunity analysis (6 benefits)", imp:2, h:`
<p>MOA gives a <b>competitive advantage</b> by finding new business areas with growth potential or where to expand in the current market. It lets you:</p>
<ol><li>Make better-informed decisions</li><li>Improve long-term marketing strategies</li><li>Evaluate product or service demand</li><li>Identify potential for business growth</li><li>Uncover strengths, weaknesses and areas for further research</li><li>Find and mitigate potential risks</li></ol>`},
{id:"whatmoa", t:"What can be assessed (7 opportunity examples)", imp:1, h:`
<p>First step: <b>identify the opportunities you want to analyze</b>. Examples:</p>
<ul><li>A new product or service</li><li>A new market to expand into</li><li>A business partnership</li><li>An unmet customer need</li><li>An improvement of something already in your offer or on the market</li><li><b>Horizontal improvement for multiple operations</b></li><li>A new niche uncovered by a shift in external factors</li></ul>`},
{id:"moasteps", t:"Market opportunity analysis — 5 steps", imp:3, h:`
<div class="seq"><span>1 Identify what's currently happening in the business environment</span><b>→</b><span>2 Define the industry and determine the outlook</span><b>→</b><span>3 Dive into the details of your competitors</span><b>→</b><span>4 Describe your target market</span><b>→</b><span>5 Create your projections</span></div>
<div class="trap">Competitors (step 3) come <b>before</b> the target market (step 4). Projections are always last.</div>
<div class="tip">“<b>E</b>very <b>I</b>ndustry <b>C</b>an <b>T</b>arget <b>P</b>rofit” — Environment, Industry, Competitors, Target, Projections.</div>`},
{id:"anmarket", t:"Analyze the market", imp:2, h:`
<p>Collect and analyze information on the <b>dynamics, size, market trends and overall demand</b> of your target market, to reveal <b>unmet needs and untapped niches</b>.</p>
<ul><li>How big is the market?</li><li>Is it growing or shrinking?</li><li>How many potential customers are there?</li><li>How strong is the competition?</li><li>Are alternative products or services about to enter the market?</li></ul>`},
{id:"comp", t:"Direct vs indirect competitors", imp:3, h:`
<div class="def"><b>Direct</b> competitors offer <b>similar products or services</b> — Netflix and Disney+.<br><b>Indirect</b> competitors sell <b>different products but satisfy the same customer need</b> — Netflix and cable TV.</div>
<p>Competitor research helps you identify <b>market gaps</b>, learn from others' successes and failures, and refine your <b>USP</b> (unique selling proposition).</p>
<h4>Questions to ask</h4>
<ul><li>Who are your direct and indirect competitors?</li><li>Which competitors are growing and why?</li><li>What competitive advantage do they have?</li><li>How are competitors marketing their products or services?</li><li>What do reviews say about competitors' offerings?</li><li>What do competitors offer that you don't?</li></ul>`},
{id:"internal", t:"Analyze internal factors", imp:2, h:`
<p>Look into your company's capabilities — <b>workforce, skills, finances</b> and other internal factors that can give you a competitive edge.</p>
<ul><li>What are your core technological strengths and unique capabilities?</li><li>How effective are your current operations and processes?</li><li>Which skills do your employees lack?</li><li>Which unique skills do your employees have?</li><li>What is your company culture and employee engagement like?</li><li>How cash-rich are you compared to the competition?</li></ul>
<div class="trap">“How cash-rich are you <i>compared to the competition</i>?” is still an <b>internal</b> question (it is about your finances).</div>`},
{id:"pest", t:"External factors: PEST table + PESTELE", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Factor</th><th>Items on the course slide</th></tr>
<tr><td><b>Political</b></td><td>Political stability &amp; regime; <b>labor laws</b>; tax/trade/tariff legislation; consumer protection laws; state of antitrust regulation; level of bureaucracy and corruption</td></tr>
<tr><td><b>Economic</b></td><td>Economy growth rates; fiscal factors (inflation and interest rates); foreign currency regulations &amp; restrictions; <b>labor costs</b>; customers' average disposable income</td></tr>
<tr><td><b>Socio-cultural</b></td><td>Population numbers (growth rate, age); <b>job market freedoms</b>; employment patterns &amp; lifestyle choices; overall social beliefs &amp; values; social taboos</td></tr>
<tr><td><b>Technological</b></td><td>Technologization rates; availability of Internet; R&amp;D &amp; communication costs; technology transfer regulations; <b>copyright &amp; intellectual property regulations</b></td></tr></table></div>
<p><b>PESTELE</b> = Political, Economic, Social, Technological, <b>Environmental</b>, <b>Legal</b>, <b>Ethical</b>.</p>
<h4>External questions from the slide</h4>
<ul><li>Domestic government policies that could impact the business?</li><li>Stable economic relations with other states?</li><li>Effect of inflation or economic growth?</li><li>Social trends (demographic shifts, lifestyle changes)?</li><li>Technological advancements?</li><li>Regulations, compliance rules, legal challenges?</li><li>Climate change effects and environmental policies?</li></ul>
<div class="trap">On the PEST slide, <b>copyright &amp; IP regulations</b> sit under <b>Technological</b>; <b>labor laws</b> under <b>Political</b> but <b>labor costs</b> under <b>Economic</b>; <b>job market freedoms</b> under <b>Socio-cultural</b>. The last E of PESTELE is <b>Ethical</b>.</div>`},
{id:"audience", t:"Understand your target audience", imp:2, h:`
<p>Create a <b>detailed profile</b> of the consumers you aim to reach — behaviors, preferences and challenges — to identify unmet needs.</p>
<ul><li>Where, when and why do people buy certain products or services?</li><li>How do they pay?</li><li>What devices do they use most?</li><li>What is their profession?</li><li>Why do they think your competitors are better than you?</li><li>How did they hear about your brand?</li><li>Which specific features do they particularly like?</li></ul>`}
]},
{id:"stp", c:"c3", week:"Week 3", name:"Segmentation & Targeting", side:"R", nodes:[
{id:"crel", t:"Positive customer relations chain", imp:2, h:`
<div class="seq"><span>Customer acquisition</span><b>→</b><span>Customer satisfaction</span><b>→</b><span>Customer retention</span><b>→</b><span>Customer loyalty</span></div>
<p>In-class activity: for a chosen market (health &amp; wellness, tech &amp; software, automotive, smart home devices, food &amp; beverage) — choose a product, segment, pick a target group, then plan acquisition (tactics to attract), satisfaction (personalized service / emotional connection), retention (keep engaged), loyalty (turn satisfied customers into <b>brand advocates</b>).</p>
<div class="trap">Retention comes <b>before</b> loyalty; satisfaction comes <b>before</b> retention.</div>`},
{id:"perso", t:"Personalized marketing strategy — 6 tactics", imp:1, h:`
<ol><li>Targeted emails</li><li>Custom video messages</li><li>Product recommendations</li><li>Social media marketing</li><li>Omnichannel marketing</li><li>Fear of missing out (FOMO)</li></ol>`},
{id:"tam", t:"Market concepts: PAM ⊃ TAM ⊃ SAM ⊃ SOM", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Circle</th><th>Name</th><th>Meaning</th></tr>
<tr><td>PAM</td><td>Potential Addressable Market</td><td>Widest theoretical pool</td></tr>
<tr><td>TAM</td><td>Total Addressable Market / Total Available Market</td><td>Total demand for the product category</td></tr>
<tr><td>SAM</td><td>Serviceable Available Market</td><td>Part of TAM your offer and channels can actually serve</td></tr>
<tr><td>SOM</td><td>Serviceable &amp; Obtainable Market, or <b>Share of Market</b></td><td>Part of SAM you can realistically win</td></tr></table></div>
<div class="trap">SOM is the <b>smallest</b> circle and its second name is “Share of Market”. TAM has two expansions: <b>Addressable</b> or <b>Available</b>.</div>`},
{id:"stpmodel", t:"STP + target-marketing stages table", imp:3, h:`
<div class="seq"><span>Segmenting</span><b>→</b><span>Targeting</span><b>→</b><span>Positioning</span></div>
<div class="tbw"><table class="tb"><tr><th>Informed by</th><th>Stage</th><th>Informs</th></tr>
<tr><td>Market research &amp; analysis of customer data</td><td><b>Segmentation</b> — identify customer needs and segment the market</td><td>Market segment definition; personal development; customer experience requirements</td></tr>
<tr><td><b>Demand analysis</b></td><td><b>Target marketing</b> — evaluate and select target segments</td><td>Select online targeting; target segments; online revenue contribution per segment; customer lifecycle targeting</td></tr>
<tr><td><b>Competitor analysis + internal analysis</b></td><td><b>Positioning</b> — identify proposition for each segment</td><td>Core brand proposition; online value proposition; online marketing mix; lifecycle brand development &amp; proposition messaging</td></tr>
<tr><td><b>Evaluation of resources</b></td><td><b>Planning</b> — deploy resources to achieve plan</td><td>Online marketing mix; restructuring; automated online customer contact strategy</td></tr></table></div>
<div class="trap">Positioning is informed by <b>competitor + internal</b> analysis, targeting by <b>demand</b> analysis. “Online marketing mix” appears as an output of <b>both</b> Positioning and Planning.</div>`},
{id:"segsteps", t:"Steps in the market segmentation process (6)", imp:2, h:`
<div class="seq"><span>1 Identify market segments</span><b>→</b><span>2 Develop profiles for each segment</span><b>→</b><span>3 Evaluate market segments</span><b>→</b><span>4 Select best market segment</span><b>→</b><span>5 Develop a positioning strategy</span><b>→</b><span>6 Focus on marketing program</span></div>`},
{id:"bases", t:"6 bases of customer segmentation", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Type</th><th>Simple Q</th><th>What it is</th><th>Examples</th><th>Why use it</th></tr>
<tr><td><b>Geographic</b></td><td>Where</td><td>Groups by location</td><td>Countries, cities, urban/suburban/rural, <b>IP addresses</b></td><td>Dynamic pricing, ease of use, country/language differences, localized offers (stores)</td></tr>
<tr><td><b>Demographic</b></td><td>Who</td><td>Groups by <b>census data</b></td><td>Age, income, family/single/couple, gender, education</td><td>Easy to use, store profiling, ideal for life stages, supplements other data</td></tr>
<tr><td><b>Psychographic</b></td><td>Why</td><td>Personal interests &amp; motivations</td><td>Interests, personality, lifestyle, social status, AIO (activities, interests, opinions), attitudes</td><td>Uncovers motivations and reasons for product &amp; brand purchases</td></tr>
<tr><td><b>Behavioural</b></td><td>What</td><td>What they do, online/offline</td><td>Benefits sought, occasion, usage rate, loyalty, buyer readiness, online actions</td><td>Patterns &amp; triggers in the buying process; tailor marketing to stages</td></tr>
<tr><td><b>Persona</b></td><td>Who, What, Why, Where</td><td>Blended data + customer goals</td><td>Jobs to be done, pains/gains, demographic + psychographic + behavioural data</td><td>Rich profile; foundation to test hypotheses and optimize results</td></tr>
<tr><td><b>Predictive</b></td><td>Who and When</td><td>Historical behaviour patterns to predict &amp; influence future behaviour</td><td>Unsupervised, supervised, reinforcement learning</td><td>Uncovers hidden buying clusters; customer discovery</td></tr></table></div>
<div class="trap">“Benefits sought” and “loyalty” = <b>Behavioural</b> (not psychographic). “Social status” = <b>Psychographic</b> (not demographic). “Jobs to be done” = <b>Persona</b>. Predictive answers <b>Who and When</b>.</div>
<p>The k-means chart in the Positioning deck (annual income vs annual spend on site, 6 clusters + red centroids) is a data-driven / predictive clustering example.</p>`},
{id:"family", t:"Family life-stage segment profiles (worked numbers)", imp:1, h:`
<div class="tbw"><table class="tb"><tr><th>Segment</th><th>Share</th><th>Frequency</th><th>Destination</th><th>$/outing</th><th>≈ $/month per person</th></tr>
<tr><td>Young singles</td><td>10%</td><td>4×/week</td><td>Bars, clubs, movies, restaurants</td><td>25</td><td>≈ 400</td></tr>
<tr><td>Young couples, no kids</td><td>8%</td><td>2×/week</td><td>Restaurants, movies, live music</td><td>43</td><td>≈ 344</td></tr>
<tr><td>Young families</td><td>28%</td><td>3×/month</td><td>Parks, movies, museums, family restaurants</td><td>57</td><td>171</td></tr>
<tr><td>Families with older kids</td><td><b>31%</b></td><td>4×/month</td><td>Movies, restaurants, sporting events</td><td><b>64</b></td><td>256</td></tr>
<tr><td>Empty nesters</td><td>23%</td><td>3×/week</td><td>Movies, restaurants, cultural events</td><td>12</td><td>≈ 144</td></tr></table></div>
<p>Weighted value (share × monthly spend): families with older kids ≈ 79 &gt; young families ≈ 48 &gt; young singles 40 &gt; empty nesters ≈ 33 &gt; young couples ≈ 28 → <b>families with older kids</b> are the most valuable segment overall, while <b>young singles</b> spend the most per person.</p>
<div class="trap">Highest spend per outing ($64) ≠ highest spend per month per person (young singles, by frequency). Empty nesters go out often (3×/week) but spend least per outing ($12).</div>`},
{id:"pmmap", t:"Product-market map: grouping individuals", imp:1, h:`
<p>“Each individual has a unique position in the market. Thus, similar locations can be combined in the market for potential target markets.”</p>
<p>Example axes: <b>status dimension</b> (vertical) × <b>reliability factor</b> (horizontal). The same market can be cut into <b>3 segments</b> (A, B, C) or more finely into <b>6 segments</b> (A–F). Dots left outside circles are customers not assigned to any target.</p>`},
{id:"evaltable", t:"Segment evaluation scoring table", imp:2, h:`
<p>Criteria: market size · growth rate · price sensitivity · competition intensity · access to distribution channel · ease of communication · competency fit · alignment with organizational goals (scored, higher = more attractive).</p>
<div class="tbw"><table class="tb"><tr><th>Criterion</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th></tr>
<tr><td>Market size</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Growth rate</td><td>4</td><td>4</td><td>1</td><td>5</td></tr>
<tr><td>Price sensitivity</td><td>5</td><td>3</td><td>3.5</td><td>3.5</td></tr><tr><td>Competition intensity</td><td>3</td><td>3</td><td>4</td><td>3</td></tr>
<tr><td>Access to distribution</td><td>3</td><td>5</td><td>3</td><td>5</td></tr><tr><td>Ease of communication</td><td>2</td><td>4</td><td>3</td><td>4</td></tr>
<tr><td>Competency fit</td><td>2</td><td>5</td><td>5</td><td>2</td></tr><tr><td>Alignment with goals</td><td>2</td><td>4</td><td>4</td><td>3</td></tr>
<tr><th>Correct sum</th><th>23</th><th>31</th><th>27.5</th><th>29.5</th></tr>
<tr><td>Printed on slide</td><td>31.0</td><td>27.5</td><td>29.5</td><td>23.0</td></tr></table></div>
<div class="trap">The slide's “Total” row does not match its own columns (it is shifted one column). Recomputed, <b>Segment 2 (31)</b> is the best and <b>Segment 1 (23)</b> the worst. If a table like this appears in the exam, add the column yourself. (“one” in S3 growth rate = 1.)</div>`},
{id:"targeting", t:"4 targeting strategies (broad → narrow)", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Strategy</th><th>Also called</th><th>Who is targeted</th></tr>
<tr><td><b>Undifferentiated</b></td><td>Mass marketing</td><td>The entire mass of the market is perceived as the target customer</td></tr>
<tr><td><b>Differentiated</b></td><td>Segmented marketing</td><td>Certain segments, each with <b>dedicated strategies</b></td></tr>
<tr><td><b>Concentrated</b></td><td>Niche marketing</td><td>A smaller, specific subset of the larger market</td></tr>
<tr><td><b>Micromarketing</b></td><td>—</td><td>An <b>individual or a specific location</b></td></tr></table></div>
<div class="trap">Several segments with separate programs = <b>differentiated</b>, not concentrated. Targeting one neighbourhood or one person = <b>micromarketing</b>.</div>`},
{id:"niche", t:"A special segment: the niche", imp:2, h:`
<ul><li>Markets that <b>no one noticed at first</b>, or that were noticed but <b>not found worth entering</b></li>
<li>A <b>small group</b> of consumers who seek or need <b>different benefits</b></li>
<li>Unnoticed and characteristic needs</li><li>It can bring profit</li>
<li><b>Unattractive for large businesses</b></li>
<li>Over time, <b>specialization and economies of scale</b> will provide (advantage)</li>
<li>Market segments that have the potential to <b>grow with profitability</b> are “niches”.</li></ul>`},
{id:"criteria", t:"Top targeting criteria for personalized experiences", imp:1, h:`
<div class="tbw"><table class="tb"><tr><th>Criterion</th><th>%</th><th>Criterion</th><th>%</th></tr>
<tr><td>Geography / region</td><td><b>38</b></td><td>Device type</td><td>25</td></tr>
<tr><td>Purchase history</td><td><b>38</b></td><td>Referral source</td><td>24</td></tr>
<tr><td>Segmentation model</td><td>33</td><td>Predictive model (manual)</td><td>24</td></tr>
<tr><td>User profile / preferences</td><td>31</td><td>Gender</td><td>23</td></tr>
<tr><td>Age</td><td>30</td><td>Session click-stream data</td><td>20</td></tr>
<tr><td>Current geo-location</td><td>28</td><td>Ethnicity</td><td>15</td></tr>
<tr><td>Browsing history</td><td>28</td><td>Predictive model (AI)</td><td><b>9</b></td></tr>
<tr><td>Shopping cart history</td><td>26</td><td>Other</td><td>1</td></tr></table></div>
<div class="trap">Top two are tied (geography and purchase history, 38%). AI predictive models are the least used real criterion (9%) — less than manual predictive models (24%).</div>`}
]},
{id:"pos", c:"c4", week:"Week 5 · Positioning deck", name:"Positioning", side:"L", nodes:[
{id:"posdef", t:"Definition & perception management", imp:3, h:`
<div class="def">A product's <b>position</b> is its <b>relative place in the customer's mind relative to competing products</b>. <b>Positioning</b> is the <b>process of creating this place</b>.</div>
<p>For positioning, it is <b>first</b> necessary to fully and accurately determine the <b>qualities and image of each of the main competitors</b>.</p>
<p>Positioning is a type of <b>perception management</b>: if you create a perception of <b>more benefit</b>, you have positioned it in a good place. Benefit types: <b>financial, psychological, social, functional, physical</b>.</p>
<div class="trap">Position lives in the <b>customer's mind</b> and is always <b>relative to competitors</b>. The five benefit types do not include “environmental” or “emotional”.</div>`},
{id:"tools", t:"Positioning tools", imp:2, h:`
<ul><li>Specific features and benefits of the product (taste, quality, durability, security, prestige, luxury…)</li><li>Brand</li><li>Packaging</li><li>Price</li><li>Usage</li><li>Image (business image – product image)</li><li>Competitive products</li><li>Sales at special distribution points</li><li>Personalized messages</li><li>Advertising</li><li>Cultural icons</li><li>Famous people</li></ul>`},
{id:"types", t:"Types of positioning", imp:3, h:`
<h4>Four types (slide)</h4>
<ul><li><b>Generic positioning</b></li><li><b>Value positioning</b></li><li><b>Positioning by feature</b></li><li><b>Emotional positioning</b></li></ul>
<h4>Competition-oriented vs consumer-oriented</h4>
<div class="tbw"><table class="tb"><tr><th>Competition oriented</th><th>Consumer oriented</th></tr>
<tr><td>Comparative messages<br>“The best, the most affordable”<br>“This is the best until we make the better one”<br>“Or are you still using your mother's margarine?”<br>“Whiter with Vanish crystal white”</td>
<td>Differentiates your target market<br>“juss: like drinking juice for the first time”<br>“Papia threefold”<br>“More hazelnuts”<br>“Exclusive in Worldcard + 4 installments”<br>“7 effective toothpaste”</td></tr></table></div>
<h4>In-class strategy options + benefits</h4>
<ul><li><b>Functional</b>: breathability, durability, flexibility, fit, moisture management</li>
<li><b>Emotional</b>: confidence, motivation, inclusion, self-expression, belonging</li>
<li><b>Value-based</b>: accessible pricing, versatile products, transparent value proposition</li>
<li><b>Competition-oriented</b>: more inclusive fit, more specialized customer experience, greater simplicity, distinct product focus</li></ul>
<div class="trap">“More hazelnuts” and “7 effective toothpaste” look like feature claims but the slide puts them under <b>consumer-oriented</b>. A slogan that compares to something else (“whiter”, “your mother's margarine”) is <b>competition-oriented</b>.</div>`},
{id:"stages", t:"7 stages of positioning", imp:3, h:`
<ol><li>Identification of <b>competing product groups</b></li><li>Identifying the <b>features to be highlighted</b></li><li>Determination of <b>consumer perceptions</b></li><li>Extraction and analysis of <b>detection (perceptual) maps</b></li><li>Identifying the <b>most preferred features</b></li><li>Determining the <b>most suitable location for the market segment</b></li><li>Determining the <b>positioning strategy</b></li></ol>
<div class="tip">Competitors → Features → Perceptions → Maps → Preferences → Location → Strategy: “<b>C</b>an <b>F</b>red <b>P</b>lease <b>M</b>ap <b>P</b>eople's <b>L</b>ocal <b>S</b>hops?”</div>
<div class="trap">Perceptions (3) are measured <b>before</b> the maps are drawn (4). Most preferred features (5) come <b>after</b> the maps.</div>`},
{id:"maps", t:"How to read a perceptual map", imp:3, h:`
<ul><li>Two axes = two attributes customers use to judge the category (price/quality, filling/treat, mass/niche…).</li>
<li>Brands close together = <b>direct rivals in the customer's mind</b>.</li>
<li>An <b>empty area</b> = possible white space (only useful if customers actually want it).</li>
<li>The <b>ideal point of the target segment</b> shows where the segment wants a brand to be; the brand nearest to it is best positioned for that segment.</li>
<li>On a price × quality map, the <b>diagonal</b> is the fair-value line: above it = price higher than perceived quality (overpriced); below it = better value for money.</li></ul>
<div class="trap">A brand in the high-price / low-quality quadrant (Infiniti, Mini on the car map) is in the weakest value position.</div>`},
{id:"mapex", t:"Perceptual map examples from class", imp:2, h:`
<h4>Clothing (Turkey) — quality × price, with diagonal</h4>
<p>Top: <b>Vakko, Lacoste</b> (≈ 8.7 / 9.2), Tommy Hilfiger, Pierre Cardin, Sarar, Mavi Jeans, Roman, D'S Damat, GAP. Middle: Marks &amp; Spencer, Stefanel, Benetton, Kiğılı, <b>ORTALAMA</b> (= “average”, ≈ 6.9 / 7). Lower: Mudo, Mango, Koton, Tiffany, DeFacto, Collezione, <b>LCW</b> (quality 5, price ≈ 4.3 → below diagonal = good value). Marks &amp; Spencer (quality ≈ 6.7, price ≈ 7.6) sits above the diagonal → priced above its perceived quality.</p>
<h4>Cars — price × quality</h4>
<p>High price/high quality: <b>Porsche, Mercedes</b>, Audi, BMW. High price/low quality: <b>Infiniti, Mini</b>. Low price/high quality: <b>Ford, Toyota, Honda</b>. Low/low: VW, Citroën, Renault, Kia, <b>Dacia</b> (extreme).</p>
<h4>Cars — classy ↔ useful × plain/old ↔ sporty/young</h4>
<p><b>Porsche</b> sits at the <b>ideal point of the target segment</b> (classy + high performance). BMW also top-right. Lincoln, Cadillac, Mercedes: classy but plain / attractive for old people. Pontiac: sporty. Chevrolet, Datsun, Toyota, VW: useful, budget-friendly, fun/young. Ford, Dodge, Plymouth: useful + plain.</p>
<h4>Chocolate — filling ↔ treat × smooth ↔ crunchy</h4>
<p>Filling + smooth: <b>Mars</b> (Galaxy just above the axis). Filling + crunchy: <b>Snickers, Twix</b>. Treat + smooth: <b>Milky Way</b>. Treat + crunchy: <b>Maltesers</b>.</p>
<h4>Airlines — seats (customers) × destinations (routes)</h4>
<p>Top-right (many seats, many routes): China Eastern, China Southern, Air China; AirAsia also right. Korean Air near the centre-top; JAL, Sichuan upper-left; ANA, Thai lower-left; Philippine Airlines lower-right.</p>
<h4>Sportswear — mass ↔ niche × price</h4>
<p>Price+ mass: Nike, Adidas, Asics, Under Armour, The North Face (Columbia near centre). Price+ niche: <b>Lululemon</b>, Yoga Smoga, Sweaty Betty, Vimma, Outdoor Voices. Price− mass: Fila, Li-Ning, New Balance, Anta. Price− niche: Athleta (centre), Urban Outfitters, Victoria's Secret, Fabletics.</p>
<h4>Feel–Think country clusters</h4>
<p>High <b>think</b>: Belgium, Italy, Netherlands, Austria, Germany. Low feel: Australia, NZ, Brazil, Argentina. High <b>feel</b>: Sweden, UK, Korea, Canada, US, Japan, Taiwan, Spain, France, Denmark. Outliers: India, Hong Kong.</p>`},
{id:"cases", t:"Brand positioning cases (6 lessons)", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Brand</th><th>Positioning</th><th>Lesson (keyword in CAPS on the slide)</th></tr>
<tr><td><b>Apple</b> — “Think different.”</td><td>Technological research, innovation; considers impact on customers and the planet. Mac vs Windows user ad.</td><td>Actions speak louder than words: embody positioning in product quality &amp; functionality; associate the brand with a <b>LIFESTYLE OR SET OF VALUES</b></td></tr>
<tr><td><b>Chipotle</b> — “Food with Integrity”</td><td>Fast-casual; just <b>53 ingredients “with names you can pronounce”</b>; healthful dining, whole ingredients; differentiates from Mexican fast-food chains</td><td>What matters to customers beyond the core product (healthy, sustainable) → use this <b>INSIGHT</b></td></tr>
<tr><td><b>Tesla</b></td><td>Mission: “accelerate the world's transition to sustainable energy”; values: environmental benefit, safety, fun (gaming, easter eggs). Tesla Aviation brand identity example.</td><td>Forward-thinking pioneer; mission resonates with <b>PREVAILING SOCIETAL VALUES</b> in every interaction</td></tr>
<tr><td><b>Nike</b> — “Just Do It”</td><td>Started on performance &amp; innovation; messaging = <b>empowerment</b>; named after the Greek goddess of victory; athletes with “game faces”, not smiling</td><td>Motivational aspect → <b>DEEP EMOTIONAL BOND</b></td></tr>
<tr><td><b>Airbnb</b></td><td>Unique travel experiences, local experiences, personal connection</td><td>Deliver <b>experiences, not just products or services</b>; authentic, personal connection</td></tr>
<tr><td><b>Southwest Airlines</b> — “Low Fares. Nothing to Hide.”</td><td>Budget airline without sacrificing quality/service; focus on people (employees + customers); “<b>Transfarency</b>”: customers treated honestly and fairly, low fares stay low</td><td>Excellent <b>VALUE</b> without sacrificing quality; customers feel part of the brand's community</td></tr></table></div>`},
{id:"measure", t:"Measuring positioning & brand awareness", imp:2, h:`
<h4>Measuring the effectiveness of brand positioning (4)</h4>
<ul><li>Track <b>brand awareness</b> with surveys, social media mentions and website analytics</li><li>Monitor <b>customer perception and sentiment</b> towards the brand</li><li>Assess <b>market share and sales growth</b> compared to competitors</li><li>Conduct regular <b>brand audits</b> to evaluate <b>consistency across all channels</b></li></ul>
<h4>6 ways to evaluate brand awareness</h4>
<ol><li>Study growth in <b>direct website traffic</b></li><li>Measure and study <b>referral traffic</b></li><li><b>Social share of voice</b></li><li><b>Backlink profiles</b></li><li>Compare your <b>earned media value</b> with competitors</li><li><b>Surveys</b></li></ol>
<div class="trap">Customer lifetime value, NPS or conversion rate are NOT among the 6 awareness measures on the slide.</div>`},
{id:"sportsw", t:"In-class: launch a new sportswear brand", imp:1, h:`
<p>Map: perceived price (low ↔ high) × brand appeal (performance ↔ lifestyle). Quadrants: <b>Premium Performance</b> (Nike, Under Armour), <b>Premium Lifestyle</b> (Lululemon; Adidas towards the centre), <b>Accessible Lifestyle</b> (Puma, New Balance), <b>Accessible Performance</b> — <b>empty</b> on the slide.</p>
<p>Rules: do <b>not</b> imitate Nike/Adidas; identify a <b>customer need</b>, a <b>relevant point of differentiation</b> and a <b>credible reason</b> to choose your brand.</p>
<p>Killer question: “If an established brand launched a similar product tomorrow, what would prevent your target customers from switching to that competitor?” → tests whether the differentiation is <b>defensible / sustainable</b>.</p>`}
]},
{id:"brand", c:"c5", week:"Week 7 · Branding deck", name:"Brand Strategy & Branding", side:"L", nodes:[
{id:"equity", t:"Brand equity: definition & formula", imp:3, h:`
<div class="def"><b>Brand equity</b> = a <b>value premium</b> that a company generates from a product with a <b>recognizable name</b> when compared to a <b>generic equivalent</b>.<br><b>BRAND EQUITY = BRAND − PRODUCT</b></div>
<p><b>Starbucks example</b>: branded cup ₹400 vs unbranded cup ₹80 → brand equity = ₹320 (80% of the price is paid for the brand).</p>
<p><b>Kellogg's Corn Flakes</b> rooster: the mascot alone is recognized on the shelf. <b>Band-Aid</b>: a child falls and you say “Band-Aid”, not “adhesive bandage” — the brand has become the category name (extreme equity).</p>`},
{id:"eqparts", t:"Brand equity: 3 circles + 6 components", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>Circle</th><th>Meaning</th></tr>
<tr><td>Consumer perception</td><td>What consumers <b>believe a brand represents</b></td></tr>
<tr><td>Positive / negative effects</td><td>What a brand's <b>reputation</b> is viewed to be</td></tr>
<tr><td>Resulting value</td><td>What <b>return</b> a brand generates for the business as a whole</td></tr></table></div>
<p>Brand equity sits at the intersection. Its six components: <b>brand image, brand identity</b> (both circled in class), brand awareness, customer perception, brand loyalty, brand association.</p>`},
{id:"identity", t:"Brand identity: definition & elements", imp:3, h:`
<ul><li>The <b>bond</b> formed between the brand and the consumer</li><li>A characteristic by which a consumer can <b>identify and express</b> a brand</li><li><b>Human characteristics</b> associated with a brand</li><li>Introduced by <b>Kapferer</b> — the slide says <b>1970</b></li><li>To be seen as a <b>true relationship partner</b>, a brand must <b>contribute to the relationship</b></li><li>Animated brand characters and interactive communication; tangible entities such as fans, movie stars</li></ul>
<p>Elements around “brand identity”: <b>communication, logo, behavior, language, mission, vision, culture, design</b>.</p>
<div class="trap">Use the slide's year (1970) in this course's exam. Outside the course the prism is usually dated 1986 — mention it only if the question asks for discussion.</div>`},
{id:"blueprint", t:"Brand blueprint vs brand identity vs brand", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th></th><th>Brand blueprint</th><th>Brand identity</th><th>Brand</th></tr>
<tr><td>Meaning</td><td>The way you <b>want to be perceived</b></td><td>The way your brand <b>presents itself</b></td><td>The way consumers <b>actually perceive you</b></td></tr>
<tr><td>Layer</td><td>Brand <b>strategy</b></td><td>Brand <b>expression</b></td><td><b>Consumer perception</b></td></tr>
<tr><td>Contents</td><td>Market opportunity, target market, brand promise, values, macro trends</td><td>Logo, colour palette, typography, tone, messaging</td><td>Expectations, emotions &amp; feelings, impressions, decisions</td></tr></table></div>
<div class="trap">“Brand promise” and “macro trends” belong to the <b>blueprint</b>; “tone” and “messaging” to <b>identity</b>. The <b>brand</b> itself is owned by the consumer's perception.</div>`},
{id:"layers", t:"Branding layers: logo → visual identity → branding", imp:2, h:`
<ul><li><b>Logo</b> (core)</li>
<li><b>Visual identity</b>: colours, imagery, layout, typography, use of space</li>
<li><b>Branding</b> (outer ring): values, brand personality, type/quality of products &amp; services, customer service philosophy, business processes, associated brands, communication channels, marketing approach, business &amp; social networking, tone of voice</li></ul>
<div class="trap">Tone of voice and customer-service philosophy are <b>branding</b>, not visual identity. The logo is only the innermost part.</div>`},
{id:"creation", t:"Brand identity creation (6 building blocks)", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>#</th><th>Block</th><th>Contents</th></tr>
<tr><td>01</td><td>Brand story</td><td>Value story, founder story, customer story</td></tr>
<tr><td>02</td><td>Personality</td><td>Mission, ethics, purpose, values</td></tr>
<tr><td>03</td><td>Tone of voice</td><td>Positioning, emotion, difference, relevance</td></tr>
<tr><td>04</td><td>Brand mark</td><td>Logo, pictograph, file formats, type, colour</td></tr>
<tr><td>05</td><td>Design</td><td>Colour, typography, tonality, weight, imagery</td></tr>
<tr><td>06</td><td>Communications</td><td>Brand guidelines, consistency, messaging, tone of voice</td></tr></table></div>
<div class="trap">“Mission, ethics, purpose, values” are under <b>Personality</b> here, not Brand story. “Positioning” appears under <b>Tone of voice</b>.</div>`},
{id:"corp", t:"Corporate identity vs brand identity", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>Corporate identity</th><th>Brand identity</th></tr>
<tr><td>Reflects company identity <b>as a whole</b></td><td><b>Specific</b> identity of the brand</td></tr>
<tr><td>Showcases company <b>mission and ethos</b></td><td>Showcases <b>each brand's values</b></td></tr>
<tr><td>Highlights <b>corporate culture</b></td><td>Speaks to the brand's <b>specific audience</b></td></tr>
<tr><td>Attention to <b>internal</b> perception</td><td>Attention to <b>external</b> perception</td></tr></table></div>`},
{id:"mascot", t:"Brand mascots: human · animal · object", imp:2, h:`
<h4>Decision tree “Choose the right mascot”</h4>
<ol><li>Promote yourself as a person (freelancer, public speaker)? → <b>Human</b></li><li>Sell a specific product that's easy to visualize? → <b>Object</b></li><li>Service that can be associated with an object (real estate → house)? → <b>Object</b></li><li>Service/product associated with an animal (milk → cow)? → <b>Animal</b></li><li>Need the mascot's look to be associated with the brand's values? → <b>Animal</b></li></ol>
<p>Examples shown: Kellogg's rooster, Colonel Sanders (KFC), Ronald McDonald, Michelin Man, Mr. Peanut, Pillsbury Doughboy, M&amp;M's, Energizer Bunny, Tony the Tiger, Mr. Clean, Mr Muscle, GEICO gecko, Kool-Aid Man, Pringles' Mr. P, Captain Morgan, Chester Cheetah, Toucan Sam, La vache qui rit, Monopoly man, Burger King, Jolly Green Giant.</p>
<p>Mascots make the brand a relationship partner (“animated brand characters and interactive communication”).</p>`},
{id:"prism", t:"Kapferer's Brand Identity Prism (6 facets)", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th></th><th>Externalization (left)</th><th>Internalization (right)</th></tr>
<tr><td><b>Sender</b> (picture of sender = company)</td><td><b>Physique</b> — physical characteristics: colours, shapes, design elements</td><td><b>Personality</b> — brand's character: tone, language, persona</td></tr>
<tr><td>Middle (bridge)</td><td><b>Relationship</b> — relationship between brand and consumer</td><td><b>Culture</b> — values and guiding principles</td></tr>
<tr><td><b>Receiver</b> (picture of receiver = consumers)</td><td><b>Reflection</b> — who you portray as the target group</td><td><b>Self-image</b> — how consumers perceive themselves when engaging with the brand</td></tr></table></div>
<div class="tip">Left = what you can <b>see from outside</b> (Physique, Relationship, Reflection — “PRR”). Right = what is <b>felt inside</b> (Personality, Culture, Self-image — “PCS”).</div>
<div class="trap"><b>Reflection</b> = the image of the <i>typical user the brand shows</i>; <b>Self-image</b> = how the <i>buyer sees himself</i> (“I'm worth it”). Classic confusion.</div>`},
{id:"prismex", t:"Prism examples: Dove · L'Oréal · Levi's", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>Facet</th><th>Dove</th><th>L'Oréal Paris</th><th>Levi's</th></tr>
<tr><td>Physique</td><td>Soft colours white &amp; blue, dove symbol, drop-shaped packaging</td><td>Women skincare dedicated to all women</td><td>Iconic red logo, blue jeans, long-lasting clothes</td></tr>
<tr><td>Personality</td><td>Natural, soft, friendly</td><td>Very beautiful, attractive women with sex appeal</td><td>Youthful, rebellious, free</td></tr>
<tr><td>Relationship</td><td>Close to women; consider them with no distinction; redefine true beauty</td><td>Women strongly trust L'Oréal: beauty partners</td><td>Sharing adventures and emotions with friends</td></tr>
<tr><td>Culture</td><td>Trust, universal, no stereotypes, down to earth</td><td>Excellence, beauty, innovation, expertise</td><td>American freedom, individualistic mindset</td></tr>
<tr><td>Reflection</td><td>Natural and confident modern women</td><td>“I can benefit from the expertise of the worldwide leader of skincare at an affordable price”</td><td>Young trendsetters, fashionable without trying too hard</td></tr>
<tr><td>Self-image</td><td>Confident, beautiful, inspired</td><td>“I'm a beautiful, independent and powerful woman. I'm worth it.”</td><td>Trendy, independent, confident</td></tr></table></div>`},
{id:"aaker", t:"Brand personality — Aaker's 5 dimensions", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Dimension</th><th>Traits</th><th>Examples (slide)</th></tr>
<tr><td><b>Sincerity</b><br>genuine, open-armed</td><td>Down-to-earth, family-oriented, honest, sincere, real, sentimental, original, wholesome, cheerful</td><td>McDonald's, Nivea, Pampers, Whole Foods, Home Depot, Hallmark, Chevrolet</td></tr>
<tr><td><b>Excitement</b><br>exciting, emotional</td><td>Daring, trendy, spirited, cool, independent, dynamic, imaginative, up-to-date</td><td>Snickers, Pixar, Axe, <b>Porsche</b>, Absolut, Red Bull, <b>Apple</b>, Virgin</td></tr>
<tr><td><b>Competence</b><br>competent, skillful</td><td>Reliable, hard-working, secure, intelligent, technical, corporate, successful, leader, confident</td><td>Google, Domestos, Ariel, Gillette, CNN, IBM, <b>Toyota</b></td></tr>
<tr><td><b>Sophistication</b><br>refined, tempted</td><td>Upper class, glamorous, good-looking, charming, feminine, smooth</td><td>Lamborghini, Baileys, <b>L'Oréal</b>, Tiffany, Four Seasons, <b>Mercedes</b>, Calvin Klein</td></tr>
<tr><td><b>Ruggedness</b><br>outdoorsy, tough</td><td>Courageous, masculine, western, rugged, active, brutal, unsentimental</td><td>Marlboro, Harley-Davidson, <b>Nike</b>, Guinness, <b>Levi's</b>, REI, Jeep</td></tr></table></div>
<div class="trap">Per the slide: <b>Nike = Ruggedness</b>, <b>Apple and Porsche = Excitement</b> (Porsche is NOT sophistication; Mercedes and Lamborghini are), <b>Toyota = Competence</b>, <b>McDonald's = Sincerity</b>.</div>
<div class="tip">“<b>S</b>he <b>E</b>njoys <b>C</b>offee, <b>S</b>ophie <b>R</b>ides” — Sincerity, Excitement, Competence, Sophistication, Ruggedness.</div>`},
{id:"color", t:"Psychology of colours", imp:2, h:`
<div class="tbw"><table class="tb"><tr><th>Colour</th><th>Psychology wheel</th><th>Colour emotion guide</th></tr>
<tr><td>Yellow</td><td>Positivity, joy, warmth, curiosity, fun, clarity, happiness</td><td>Optimism, clarity, warmth</td></tr>
<tr><td>Orange</td><td>Emotion, optimism, pleasure, freedom, enthusiasm, original, youth</td><td>Friendly, cheerful, confidence</td></tr>
<tr><td>Red</td><td>Excitement, adventure, strength, energy, passion, action, love</td><td>Excitement, youthful, bold</td></tr>
<tr><td>Pink</td><td>Intuition, softness, femininity, respect, calm, gratitude, creativity</td><td>—</td></tr>
<tr><td>Purple</td><td>Imagination, justice, royalty, fantasy, mystery, art, spirituality</td><td>Creative, imaginative, wise</td></tr>
<tr><td>Blue</td><td>Success, power, trust, security, confidence, purpose</td><td>Trust, dependable, strength</td></tr>
<tr><td>Green</td><td>Nature, luck, health, prosperity, safety, harmony, loyalty</td><td>Peaceful, growth, health</td></tr>
<tr><td>Grey</td><td>—</td><td>Balance, neutral, calm</td></tr></table></div>
<p>Packaging slide: <b>blue often conveys trust</b>, <b>red can create a sense of urgency</b>.</p>`}
]},
{id:"pack", c:"c6", week:"Week 7 · Branding deck", name:"Packaging as a Strategic Tool", side:"L", nodes:[
{id:"pkdef", t:"Packaging as a strategic marketing tool", imp:3, h:`
<div class="def">Packaging serves as a critical strategic marketing tool that <b>transcends mere protection</b>. It plays a vital role in <b>differentiation</b>, <b>delivering value</b> to consumers, establishing <b>competitive positioning</b>, and <b>fulfilling brand promises</b> — thus influencing consumer perceptions and purchasing decisions.</div>
<p>Packaging is one of the two Ps the <b>9P</b> model adds (with Public Relations), and a <b>positioning tool</b>.</p>`},
{id:"pkfun", t:"4 functions of packaging beyond protection", imp:3, h:`
<div class="tbw"><table class="tb"><tr><th>Function</th><th>Slide content</th></tr>
<tr><td><b>Differentiation</b></td><td>Helps consumers recognize and choose brands in a crowded marketplace; unique shapes, colours and designs create a memorable first impression</td></tr>
<tr><td><b>Value delivery</b></td><td>Enhances user experience, preserves product quality, convenience: easy-open features, portion control, materials that enhance freshness</td></tr>
<tr><td><b>Competitive positioning</b></td><td>Aligns with brand messaging and market positioning; communicates the value proposition relative to competitors</td></tr>
<tr><td><b>Brand promise</b></td><td>Reflects values, quality and identity; creates expectations and trust → loyalty and repeat purchases</td></tr></table></div>
<div class="tip">“<b>D</b>on't <b>V</b>alue <b>C</b>heap <b>P</b>romises” — Differentiation, Value delivery, Competitive positioning, brand Promise.</div>
<div class="trap">Portion control and easy-open = <b>value delivery</b>, not differentiation. Trust and repeat purchase = <b>brand promise</b>.</div>`},
{id:"pkbeh", t:"Consumer behaviour & packaging perception", imp:2, h:`
<ul><li><b>Visual attention &amp; eye-tracking</b>: imagery and bold typography capture and hold attention</li>
<li><b>Colour, shape, texture, material cues</b>: shape aesthetic appeal and emotional responses (blue → trust, red → urgency)</li>
<li><b>Heuristics &amp; biases</b>: the <b>size–value heuristic</b> — larger packages are often perceived as better value, <b>regardless of the actual contents</b></li>
<li><b>Impulse buying triggers &amp; point-of-sale dynamics</b>: stand-out packaging and strategic placement prompt unplanned purchases</li></ul>`},
{id:"pkdesign", t:"Packaging design principles (5)", imp:2, h:`
<ul><li><b>Structural design &amp; front-of-pack architecture</b>: physical shape/form; windows, cutouts, unique shapes; easier handling and storage</li>
<li><b>Shelf impact &amp; category visibility</b>: attract attention among competitors; easy recognition → impulse purchases, brand recall</li>
<li><b>Private label vs national brand design logic</b>: national brands leverage <b>brand equity, premium materials, innovation, standout design</b>; private labels use <b>cost-effective</b> designs stressing <b>value and functionality</b> for budget-conscious shoppers</li>
<li><b>Typography &amp; colour theory</b>: fonts convey personality and readability; colours trigger psychological responses</li>
<li><b>Visual hierarchy</b>: guides attention via <b>size, colour contrast and placement</b> so key messages are noticed first</li></ul>`},
{id:"pkid", t:"Packaging & brand identity (4)", imp:2, h:`
<ul><li><b>Consistency with brand personality</b>: colours, shapes, typography reinforce personality</li>
<li><b>Brand memory &amp; recognition</b>: lasting impression → higher recall and preference</li>
<li><b>Portfolio architecture</b>: differentiates <b>line extensions and sub-brands</b>; visual cues help navigate a brand family</li>
<li><b>Signature packaging &amp; brand assets</b>: iconic packaging becomes a valuable asset → loyalty and repeat purchases</li></ul>`},
{id:"pkinno", t:"Strategic packaging innovations (4)", imp:2, h:`
<ul><li><b>Smart packaging technologies</b>: QR codes, NFC chips, sensors → real-time information, better UX, <b>tracking and authentication</b></li>
<li><b>AR/VR-enhanced experiences</b>: scan the pack for extra information or entertainment</li>
<li><b>Minimalist &amp; transparent design</b>: fewer materials, clear labelling → perceived quality; appeals to consumers seeking <b>authenticity and sustainability</b></li>
<li><b>Personalization strategies</b>: customized labels, unique designs, interactive elements (e.g. <b>Nutella jars with first names</b>)</li></ul>`},
{id:"pkcomp", t:"Packaging & competitive positioning (3)", imp:2, h:`
<ul><li><b>Premiumization vs economy packaging</b>: premium materials and unique designs create luxury/exclusivity and justify a higher price (Elizabeth Arden)</li>
<li><b>Disruptive category design</b>: <b>Oatly</b> and <b>Method</b> broke packaging norms with sustainable materials and innovative designs that communicate brand values</li>
<li><b>Market leaders vs challenger brands</b>: leaders use packaging to <b>reinforce brand equity and loyalty</b>; challengers use <b>distinctive designs to differentiate</b>, often appealing to niche segments</li></ul>`},
{id:"pkex", t:"Creative packaging examples", imp:1, h:`
<ul><li>NYC spaghetti box shaped like a skyline; pasta boxes where the pasta becomes the woman's hair (Fettuccine, Spaghettoni, Cavatappi)</li>
<li>Fruit-slice juice boxes; juice cartons with real fruit skin texture (kiwi, banana, strawberry)</li>
<li>Hanger tea bags (T-shirt shaped bags on a hanger)</li>
<li>Earphones packaged as a musical note; wool sold inside a black sheep</li>
<li>Nike Air shoe sealed in an air-filled bag; <b>Festina</b> watches sold in water bags (“engineered for water”)</li>
<li>Butter portion whose lid is a knife; paintbrushes dressed as moustaches; shoe-lace handles on shopping bags</li>
<li>Natub kraft boxes; personalized Nutella jars</li></ul>
<p>Common thread: the package <b>demonstrates the product's key benefit</b> (waterproof, air cushioning, fresh fruit) or creates a memorable, shareable experience.</p>`}
]}

const TOPICS={strat:"Strategic thinking",env:"Opportunities & environment",stp:"Segmentation & targeting",pos:"Positioning",brand:"Branding",pack:"Packaging"};
