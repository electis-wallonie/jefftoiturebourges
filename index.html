const Q=[
/* ---- Strategic thinking ---- */
{t:"strat",q:"A firm believes customers will only buy if it pushes them through aggressive selling and promotion. In the course's “orientation towards the marketplace” sequence, which concept comes IMMEDIATELY BEFORE this one?",o:["Production concept — emphasis on producing goods","Product concept — producing quality goods","Marketing concept — right products for customers","Holistic marketing concept — do everything possible"],a:1,x:"The sequence is Production → Product → Selling → Marketing → Holistic. Aggressive selling is the Selling concept, so the one before it is the Product concept (quality goods). “Producing goods” alone is the Production concept."},
{t:"strat",q:"Which set lists ONLY the elements that the 9P model adds on top of the 7P model?",o:["People, Physical evidence, Processes","Packaging, Public relations","Positioning, Packaging","Public relations, Partnerships, Purpose"],a:1,x:"4P = Product, Price, Place, Promotion. 7P adds People, Physical evidence, Processes. 9P adds exactly Packaging and Public Relations."},
{t:"strat",q:"In the services marketing-mix wheel shown in class, “internal marketing” is listed under which element?",o:["People","Process","Promotion","Physical evidence"],a:2,x:"Promotion = internal marketing, direct marketing, advertising, other promotional methods. Students instinctively pick People, but People = customers, employees, social interactions, roles & scripts, relationships."},
{t:"strat",q:"On the same wheel, which item does NOT belong under “Process”?",o:["Service design","Standardization","Customization","Supplementary services"],a:3,x:"Process = service design, standardization, customization, operational efficiency. Supplementary services belong to Product (with total service product, core product, facilitating and supporting services)."},
{t:"strat",q:"“Roles & scripts”, “uniforms” and “relationship-based” appear on the 7P wheel. Match them correctly.",o:["People · Physical evidence · Price","Process · Physical evidence · Promotion","People · People · Price","Process · Promotion · Place"],a:0,x:"Roles & scripts → People. Uniforms → Physical evidence (with facilities, livery & artefacts, signage, symbols). Relationship-based → a pricing approach (Price: cost-, demand-, operations-, competition-, relationship-based)."},
{t:"strat",q:"According to the “Evolution of Marketing” slide, in which decade did the customer “wish to follow us using their personal details”?",o:["1990s","2000s","2010s","2020s"],a:2,x:"80s: pay attention to ads · 90s: build a website and they come · 00s: become our friends and like us on Facebook · 10s: follow us using personal details · 20s: hang out with our brand in the virtual world."},
{t:"strat",q:"Which statement about the Marketing-Evolution (push → pull) chart is correct?",o:["PR, event marketing and product placement are above-the-line push tools","Content, viral and word-of-mouth marketing form the online below-the-line end of the shift","Online Marketing 1.0 is performance marketing priced per click","Social-media marketing is classified as above-the-line advertising"],a:1,x:"The shift runs from push (above-the-line) to pull (below-the-line). PR, events and product placement are offline BELOW-the-line. Online Marketing 1.0 = push advertising (display by TKP, e-mail); 2.0 = performance marketing (CPC, SEO, SEA, affiliate). The final stage is online BTL: content, viral, WOM."},
{t:"strat",q:"“Display advertising according to TKP” belongs to which stage of the chart, and what does TKP measure?",o:["Online Marketing 2.0 — cost per click","Online Marketing 1.0 — cost per thousand contacts","Below-the-line offline — cost per event","Social-media marketing — cost per follower"],a:1,x:"TKP (Tausend-Kontakt-Preis) = price per thousand contacts, i.e. CPM. It is listed under Online Marketing 1.0 (push advertising). CPC is the performance-marketing model of Online Marketing 2.0."},
{t:"strat",q:"In the orientation timeline (1950 → 2020), which orientation comes directly AFTER “competitive orientation”?",o:["Market orientation","Environment orientation","Performance orientation","Distribution orientation"],a:1,x:"Product (1950) → Distribution (1960) → Market (1970) → Competitive (1980) → Environment (1990) → Performance & Dialog (2000) → Network (2010) → Below-the-line & Content (2020)."},
{t:"strat",q:"In the 8-step marketing strategy process, what comes immediately after “Develop value proposition”?",o:["Perform marketing research","Define marketing strategies","Set marketing goals","Define marketing mix"],a:2,x:"Existing plan → Research → Value proposition → Set marketing goals → Define marketing strategies → Define marketing mix → Marketing plan → Review & reassess (loop)."},
{t:"strat",q:"On the marketing-strategy wheel, which step comes immediately BEFORE “Marketing budget”?",o:["Define marketing mix","Determine market position","Analyze competition","Execution plan"],a:1,x:"Understand customer → Analyze market → Analyze competition → Define marketing mix → Determine market position → Marketing budget → Execution plan (“also called marketing plan”)."},
{t:"strat",q:"Which of these is NOT one of the six benefits of a market development strategy shown in class?",o:["Up-sells current users","Helps to lessen production cost per unit","Increases revenue margins","Reduces dependence on intermediaries"],a:3,x:"The six: improves product quality, acquires new users, up-sells current users, helps develop new products, increases revenue margins, lessens production cost per unit."},
{t:"strat",q:"Which definition of marketing strategy was used in class?",o:["The set of tactical promotional activities used in a campaign","A business's overall game plan for reaching prospective consumers and turning them into customers of their products","The process of creating a place for the product in the customer's mind","The value premium generated by a recognizable name versus a generic equivalent"],a:1,x:"That is the Investopedia definition on the slide. “Creating a place in the customer's mind” is positioning; “value premium vs a generic equivalent” is brand equity."},
/* ---- Opportunities & environment ---- */
{t:"env",q:"In the 8-step marketing cycle around the consumer, what sits between “Customer feedback” and “Adjustment”?",o:["Distribution","Analysis","Market research","Sales"],a:1,x:"Market research → Product development → Promotion → Sales → Distribution → Customer feedback → Analysis → Adjustment → (back to research)."},
{t:"env",q:"Which of the following is a MACRO-environment force in the course model?",o:["Publics","Intermediaries","Demographic","Competitors"],a:2,x:"Micro = suppliers, customers, competitors, intermediaries, distributors, publics. Macro = technological, social/cultural, demographic, environmental, economic, political/legal."},
{t:"env",q:"A government makes EV charging points mandatory in all new buildings, creating sudden demand for installers. Which of the four types of market opportunity is this?",o:["Untapped or underserved audience","Technological innovation","Societal change","Regulatory intervention"],a:3,x:"The trigger is a law, so it is a regulatory intervention — even though EVs are a technology and sustainability is a societal trend."},
{t:"env",q:"According to the course, Netflix's relationship with Disney+ and with cable TV is, respectively:",o:["Indirect · direct","Direct · indirect","Direct · direct","Indirect · indirect"],a:1,x:"Direct competitors offer similar products (Netflix vs Disney+). Indirect competitors sell different products that satisfy the same need (Netflix vs cable TV)."},
{t:"env",q:"What is step 4 of the 5-step market opportunity analysis?",o:["Dive into the details of your competitors","Describe your target market","Define the industry and determine the outlook","Create your projections"],a:1,x:"1 Identify what's happening in the business environment → 2 Define industry & outlook → 3 Competitors → 4 Target market → 5 Projections."},
{t:"env",q:"On the course's PEST table, under which factor are “copyright & intellectual property regulations” listed?",o:["Political","Economic","Socio-cultural","Technological"],a:3,x:"Trap: it sounds legal/political, but the slide lists it under Technological, along with technologization rates, Internet availability, R&D & communication costs and technology-transfer regulations."},
{t:"env",q:"Which pairing matches the course's PEST table?",o:["Labor laws → Economic; labor costs → Political","Labor laws → Political; labor costs → Economic","Both → Economic","Both → Political"],a:1,x:"Political: stability & regime, labor laws, tax/trade/tariff, consumer protection, antitrust, bureaucracy & corruption. Economic: growth, inflation & interest rates, foreign-currency regulation, labor costs, disposable income."},
{t:"env",q:"“Job market freedoms” appears under which PEST factor?",o:["Political","Economic","Socio-cultural","Technological"],a:2,x:"Socio-cultural = population numbers (growth, age), job market freedoms, employment patterns & lifestyle choices, social beliefs & values, social taboos."},
{t:"env",q:"In PESTELE, what do the letters after T stand for?",o:["Economic, Legal, Ethical","Environmental, Legal, Ethical","Environmental, Labor, Economic","Ethical, Legal, Environmental"],a:1,x:"P-E-S-T-E-L-E = Political, Economic, Social, Technological, Environmental, Legal, Ethical. The final E is Ethical."},
{t:"env",q:"Which question belongs to the INTERNAL-factors analysis rather than to the market, competitor or external analysis?",o:["What do competitors offer that you don't?","How cash-rich are you compared to the competition?","Are there alternative products about to enter the market?","Is the country maintaining stable economic relations with other states?"],a:1,x:"Despite the words “compared to the competition”, this question is about your own finances, so it is internal. “What competitors offer” = competitor research; “alternatives about to enter” = market analysis; “stable relations with other states” = external."},
{t:"env",q:"Which is NOT one of the six reasons to run a market opportunity analysis?",o:["Make better-informed decisions","Find and mitigate potential risks","Guarantee a first-mover advantage","Uncover your strengths, weaknesses and areas for further research"],a:2,x:"The six: better-informed decisions, improved long-term strategies, evaluate demand, identify growth potential, uncover strengths/weaknesses/research areas, find and mitigate risks. Nothing is guaranteed."},
{t:"env",q:"Which of these is NOT given as an example of an opportunity you could choose to analyze?",o:["A business partnership","Horizontal improvement for multiple operations","A new niche uncovered by a shift in external factors","Vertical integration of your suppliers"],a:3,x:"Examples: new product/service, new market, business partnership, unmet need, improvement of something existing, horizontal improvement for multiple operations, new niche from external shifts."},
{t:"env",q:"Competitor research helps you do three things according to the slide. Which option lists them?",o:["Identify market gaps, learn from others' successes and failures, refine your USP","Set prices, choose channels, plan the budget","Segment, target, position","Measure awareness, share of voice and backlinks"],a:0,x:"“Proper analysis will help you identify market gaps, learn from the successes and failures of others, and refine your unique selling proposition (USP).”"},
{t:"env",q:"The definition of a market opportunity in class is a need or want for a product, service or feature that is…",o:["…already served by the market leader","…either not being met or underserved","…created by advertising","…protected by regulation"],a:1,x:"“A need or want for a product, service, or feature that is either not being met or is underserved.”"},

{t:"stp",q:"A start-up's product could in theory serve 40M people (category demand). With its language, channels and country it can serve 2M, and it realistically expects to win 150k in year 3. 150k is its:",o:["TAM","SAM","SOM","PAM"],a:2,x:"PAM ⊃ TAM ⊃ SAM ⊃ SOM. 40M ≈ TAM, 2M = SAM (serviceable available), 150k = SOM (serviceable & obtainable market, or share of market)."},
{t:"stp",q:"In the chain of positive customer relations, which stage comes immediately before customer loyalty?",o:["Customer acquisition","Customer satisfaction","Customer retention","Customer advocacy"],a:2,x:"Acquisition → Satisfaction → Retention → Loyalty. Advocacy is the in-class goal of loyalty, not a separate stage."},
{t:"stp",q:"A segmentation that uses supervised, unsupervised and reinforcement learning on historical behaviour to answer “who and when” is:",o:["Behavioural","Persona","Predictive","Psychographic"],a:2,x:"Predictive segmentation = historical behavioural patterns to predict and influence future behaviour; uncovers hidden buying clusters. Persona answers Who/What/Why/Where."},
{t:"stp",q:"“Benefits sought, occasion, usage rate, loyalty, buyer readiness” are examples of which segmentation base?",o:["Psychographic","Behavioural","Demographic","Persona"],a:1,x:"Behavioural = what customers do (online/offline). Psychographic = interests, personality, lifestyle, social status, AIO, attitudes — the “why”."},

{t:"stp",q:"“Jobs to be done” and “pains / gains” are examples used for which segmentation base?",o:["Persona","Predictive","Behavioural","Psychographic"],a:0,x:"Persona segmentation blends demographic, psychographic and behavioural data with customer goals — jobs to be done, pains/gains."},
{t:"stp",q:"Which segmentation base is described as being based on census data and “ideal for life stages”?",o:["Geographic","Demographic","Persona","Psychographic"],a:1,x:"Demographic: easy to use, good for store profiling, ideal for life stages, good to supplement with other data."},
{t:"stp",q:"Family life-stage data: Young singles 10% · 4×/week · $25; Young couples 8% · 2×/week · $43; Young families 28% · 3×/month · $57; Families with older kids 31% · 4×/month · $64; Empty nesters 23% · 3×/week · $12. Which segment brings the largest TOTAL monthly leisure spend (share × frequency × spend)?",o:["Young singles","Young families","Families with older kids","Empty nesters"],a:2,x:"Monthly per person ≈ singles 400, couples 344, young families 171, older-kids families 256, empty nesters 144. Weighted by share: 40, 27.5, 47.9, 79.4, 33.1 → families with older kids win."},

{t:"stp",q:"The slide's segment-evaluation table prints totals 31.0 / 27.5 / 29.5 / 23.0 for segments 1–4. If you add the eight criteria in each column yourself, which segment is actually the most attractive?",o:["Segment 1","Segment 2","Segment 3","Segment 4"],a:1,x:"Correct sums: S1 = 23, S2 = 31, S3 = 27.5, S4 = 29.5. The printed totals are shifted one column. Always recompute."},
{t:"stp",q:"A coffee chain sends app offers that differ for each individual customer and each store's neighbourhood. Which targeting strategy is this?",o:["Differentiated marketing","Concentrated marketing","Micromarketing","Undifferentiated marketing"],a:2,x:"Micromarketing targets an individual or a specific location — the narrowest end of the broad → narrow scale."},
{t:"stp",q:"A carmaker runs separate programs for families, young urban drivers and luxury buyers. Which targeting strategy?",o:["Concentrated (niche)","Differentiated (segmented)","Undifferentiated (mass)","Micromarketing"],a:1,x:"Several segments, each with dedicated strategies = differentiated. Concentrated = one smaller specific subset."},
{t:"stp",q:"Which statement is NOT a characteristic of a niche as described in class?",o:["A small group of consumers who seek different benefits","It is unattractive for large businesses","It is attractive for large businesses because of economies of scale","A segment with potential to grow with profitability"],a:2,x:"The slide says niches are UNattractive for large businesses. Specialization and economies of scale come over time to the niche player."},
{t:"stp",q:"In the target-marketing table, which analysis informs the Positioning stage?",o:["Demand analysis","Market research & analysis of customer data","Competitor analysis and internal analysis","Evaluation of resources"],a:2,x:"Segmentation ← market research & customer data; Target marketing ← demand analysis; Positioning ← competitor + internal analysis; Planning ← evaluation of resources."},
{t:"stp",q:"“Automated online customer contact strategy” and “restructuring” are outputs of which stage?",o:["Segmentation","Target marketing","Positioning","Planning"],a:3,x:"Planning (deploy resources to achieve plan) informs online marketing mix, restructuring and automated online customer contact strategy."},
{t:"stp",q:"In the 6-step segmentation process, what comes right after “Evaluate market segments”?",o:["Develop profiles for each segment","Select best market segment","Develop a positioning strategy","Focus on marketing program"],a:1,x:"Identify → Develop profiles → Evaluate → Select best → Develop positioning strategy → Focus on marketing program."},
{t:"stp",q:"Among the top targeting criteria for personalized experiences, which real criterion is used LEAST (ignoring “Other”)?",o:["Ethnicity (15%)","Session click-stream data (20%)","Predictive model – AI (9%)","Predictive model – manual (24%)"],a:2,x:"Geography/region and purchase history lead (38% each). AI predictive models are at 9%, below manual predictive models (24%)."},
{t:"stp",q:"Which is NOT one of the six personalized-marketing tactics listed?",o:["Custom video messages","Omnichannel marketing","Fear of missing out (FOMO)","Mass TV sponsorship"],a:3,x:"The six: targeted emails, custom video messages, product recommendations, social media marketing, omnichannel marketing, FOMO."},
/* ---- Positioning ---- */
{t:"pos",q:"According to the course, what must be done FIRST before positioning a product?",o:["Choose a slogan","Fully and accurately determine the qualities and image of each of the main competitors","Set the price","Build a perceptual map of your own features"],a:1,x:"Slide: “For positioning, it is first necessary to fully and accurately determine the qualities and image of each of the main competitors.” Position is always relative to competitors."},
{t:"pos",q:"Positioning is “a type of perception management”. Which benefit type is NOT on the slide's list?",o:["Psychological","Social","Environmental","Physical"],a:2,x:"The five: financial, psychological, social, functional, physical."},
{t:"pos",q:"Which slogan does the course classify as COMPETITION-oriented positioning?",o:["“More hazelnuts”","“7 effective toothpaste”","“Whiter with Vanish crystal white”","“Papia threefold”"],a:2,x:"Competition-oriented = comparative messages (“whiter”, “the best, the most affordable”, “still using your mother's margarine?”). “More hazelnuts”, “7 effective”, “Papia threefold” are on the consumer-oriented side."},
{t:"pos",q:"What is stage 4 of the 7 stages of positioning?",o:["Determination of consumer perceptions","Extraction and analysis of detection (perceptual) maps","Identifying the most preferred features","Determining the most suitable location for the market segment"],a:1,x:"1 Competing product groups → 2 Features to highlight → 3 Consumer perceptions → 4 Perceptual maps → 5 Most preferred features → 6 Most suitable location for the segment → 7 Positioning strategy."},
{t:"pos",q:"Which stage comes immediately before “Determining the positioning strategy”?",o:["Identifying the most preferred features","Determining the most suitable location for the market segment","Identification of competing product groups","Determination of consumer perceptions"],a:1,x:"Stage 6 (most suitable location for the segment) precedes stage 7 (positioning strategy)."},
{t:"pos",q:"On the clothing price × quality map, LCW sits at quality ≈ 5 and price ≈ 4.3, below the diagonal. The best interpretation is:",o:["LCW is overpriced for its quality","LCW offers more perceived quality than its price suggests — a value-for-money position","LCW is a premium brand","LCW sits exactly on the fair-value line"],a:1,x:"The diagonal is the fair-value line. Below it, price < perceived quality → good value. Marks & Spencer (quality ≈ 6.7, price ≈ 7.6) is above it → priced above its perceived quality."},
{t:"pos",q:"On the car price × quality map, which brands sit in the weakest value quadrant (high price, low quality)?",o:["Ford and Toyota","Infiniti and Mini","Dacia and Kia","Audi and BMW"],a:1,x:"Infiniti and Mini are high price / low quality. Ford, Toyota, Honda are high quality / low price (best value). Dacia and Kia are low/low."},
{t:"pos",q:"On the classic car map (classy ↔ useful, plain/old ↔ sporty/young), which brand is closest to the “ideal point of the target segment”?",o:["Cadillac","BMW","Porsche","Pontiac"],a:2,x:"The ideal point (classy + high performance/sporty) sits on Porsche. BMW is near but below; Cadillac is classy but plain/old; Pontiac is sporty but less classy."},
{t:"pos",q:"A new chocolate is launched as a “crunchy treat” (crunchy + treat). On the class map, its most direct rival is:",o:["Snickers","Milky Way","Maltesers","Mars"],a:2,x:"Maltesers = crunchy + treat. Milky Way = smooth + treat; Snickers and Twix = crunchy + filling; Mars = smooth + filling."},
{t:"pos",q:"On the in-class sportswear map (perceived price × performance ↔ lifestyle), which quadrant was empty — a possible white space?",o:["Premium performance","Premium lifestyle","Accessible lifestyle","Accessible performance"],a:3,x:"Nike & Under Armour = premium performance, Lululemon = premium lifestyle, Puma & New Balance = accessible lifestyle. Accessible performance had no brand."},
{t:"pos",q:"On the mass ↔ niche × price sportswear map, Lululemon is positioned as:",o:["Price+ / mass market","Price+ / niche market","Price− / niche market","Price− / mass market"],a:1,x:"Lululemon sits with Yoga Smoga, Sweaty Betty, Vimma and Outdoor Voices in premium-niche. Nike/Adidas = premium-mass; Li-Ning/Anta = low-price mass; Fabletics = low-price niche."},
{t:"pos",q:"Which country is NOT in the “high feel” cluster of the Feel–Think map?",o:["Japan","Denmark","Netherlands","Spain"],a:2,x:"High think: Belgium, Italy, Netherlands, Austria, Germany. High feel: Sweden, UK, Korea, Canada, US, Japan, Taiwan, Spain, France, Denmark."},
{t:"pos",q:"Which brand lesson says your mission should resonate with PREVAILING SOCIETAL VALUES and position you as a forward-thinking pioneer?",o:["Apple","Tesla","Nike","Airbnb"],a:1,x:"Tesla: “accelerate the world's transition to sustainable energy”. Apple = lifestyle or set of values; Nike = deep emotional bond; Airbnb = experiences, not products."},
{t:"pos",q:"“Instead of relying on explicit mission statements, embody your positioning in the quality and functionality of your products” is the lesson from:",o:["Chipotle","Southwest Airlines","Apple","Tesla"],a:2,x:"Apple: actions speak louder than words; customers associate the brand with a LIFESTYLE OR SET OF VALUES (“Think different.”)."},
{t:"pos",q:"Chipotle's “53 ingredients with names you can pronounce” illustrates which lesson?",o:["Compete on the lowest price","Use the INSIGHT about what matters to customers beyond the core product","Build a deep emotional bond through motivation","Deliver experiences rather than products"],a:1,x:"Chipotle differentiated from Mexican fast-food chains through healthy ingredients and sustainable practices — what customers care about beyond the core product (“Food with Integrity”)."},
{t:"pos",q:"“Transfarency” is the philosophy of which brand, and what is its lesson?",o:["Airbnb — authentic personal connection","Southwest — excellent VALUE without sacrificing quality","Tesla — societal values","Nike — empowerment"],a:1,x:"Southwest: “Low Fares. Nothing to Hide.” Customers are treated honestly and fairly and low fares stay low; people (employees and customers) feel part of a community."},
{t:"pos",q:"Which of these is NOT one of the 6 ways to evaluate brand awareness?",o:["Social share of voice","Backlink profiles","Customer lifetime value","Comparing your earned media value with competitors"],a:2,x:"The six: direct website traffic growth, referral traffic, social share of voice, backlink profiles, earned media value vs competitors, surveys."},
{t:"pos",q:"In “measuring the effectiveness of brand positioning”, what are regular brand audits used for?",o:["To compute brand equity in money","To evaluate consistency across all channels","To track backlink growth","To set the marketing budget"],a:1,x:"The four: track awareness (surveys, social mentions, web analytics); monitor perception & sentiment; assess market share & sales growth vs competitors; regular brand audits for consistency across channels."},
{t:"pos",q:"The in-class question “If an established brand launched a similar product tomorrow, what would prevent your customers from switching?” mainly tests whether your positioning is:",o:["Cheap enough","Defensible — a credible, hard-to-copy point of differentiation","Visible on social media","Based on the 4P"],a:1,x:"The challenge required a customer need, a relevant point of differentiation and a credible reason to choose the brand. The question checks that the difference cannot be copied overnight."},
{t:"pos",q:"Which is listed as a positioning TOOL in class?",o:["Cultural icons","Backlink profiles","TAM / SAM / SOM","Customer retention"],a:0,x:"Tools: features & benefits, brand, packaging, price, usage, image, competitive products, sales at special distribution points, personalized messages, advertising, cultural icons, famous people."},
/* ---- Branding ---- */
{t:"brand",q:"A Starbucks cup sells for ₹400; an identical unbranded cup sells for ₹80. Using the course formula, what share of the Starbucks price is brand equity?",o:["20%","25%","75%","80%"],a:3,x:"Brand equity = Brand − Product = 400 − 80 = ₹320. 320 / 400 = 80%."},
{t:"brand",q:"In the brand-equity Venn diagram, “what return a brand generates for the business as a whole” is:",o:["Consumer perception","Positive / negative effects","Resulting value","Brand association"],a:2,x:"Consumer perception = what consumers believe the brand represents; positive/negative effects = what its reputation is viewed to be; resulting value = return for the business."},
{t:"brand",q:"According to the Brand Blueprint vs Brand Identity vs Brand slide, “the way consumers ACTUALLY perceive you” is the:",o:["Brand blueprint","Brand identity","Brand","Brand strategy"],a:2,x:"Blueprint = how you want to be perceived (strategy). Identity = how the brand presents itself (expression). Brand = how consumers actually perceive you."},
{t:"brand",q:"“Brand promise”, “values” and “macro trends” belong to which part of that slide?",o:["Brand blueprint (brand strategy)","Brand identity (brand expression)","Brand (consumer perception)","Visual identity"],a:0,x:"Blueprint: market opportunity, target market, brand promise, values, macro trends. Identity: logo, colour palette, typography, tone, messaging. Brand: expectations, emotions, impressions, decisions."},
{t:"brand",q:"Which statement describes CORPORATE identity rather than brand identity?",o:["Speaks to the brand's specific audience","Showcases each brand's values","Pays attention to internal perception","Pays attention to external perception"],a:2,x:"Corporate identity: company as a whole, mission & ethos, corporate culture, internal perception. Brand identity: specific brand, its values, its audience, external perception."},
{t:"brand",q:"Which three facets sit on the INTERNALIZATION side of Kapferer's prism?",o:["Physique, Relationship, Reflection","Personality, Culture, Self-image","Physique, Personality, Culture","Relationship, Culture, Reflection"],a:1,x:"Externalization (left): Physique, Relationship, Reflection. Internalization (right): Personality, Culture, Self-image."},
{t:"brand",q:"L'Oréal: “Thanks to L'Oréal I'm a beautiful, independent and powerful woman. I'm worth it.” Which prism facet is this?",o:["Reflection","Personality","Self-image","Relationship"],a:2,x:"Self-image = how consumers perceive themselves when using the brand. Reflection = who the brand portrays as its target user."},
{t:"brand",q:"Dove: “Natural and confident modern women.” Which facet?",o:["Self-image","Reflection","Personality","Culture"],a:1,x:"Reflection = the portrayed target user. Dove's self-image is “confident, beautiful, inspired”; personality “natural, soft and friendly”; culture “trust, universal, no stereotypes, down to earth”."},
{t:"brand",q:"Levi's: “The American freedom, an individualistic mindset.” Which facet?",o:["Personality","Culture","Relationship","Physique"],a:1,x:"Culture = values and guiding principles. Levi's personality = youthful, rebellious, free; relationship = sharing adventures and emotions with friends; physique = red logo, blue jeans, long-lasting clothes."},
{t:"brand",q:"In Kapferer's prism, which two facets form the “picture of the SENDER”?",o:["Reflection and Self-image","Relationship and Culture","Physique and Personality","Personality and Self-image"],a:2,x:"Sender (company) at the top: Physique and Personality. Receiver (consumers) at the bottom: Reflection and Self-image. Relationship and Culture form the bridge."},
{t:"brand",q:"According to the course's Aaker slide, which brand–dimension pair is CORRECT?",o:["Porsche — Sophistication","Toyota — Competence","Apple — Sophistication","McDonald's — Excitement"],a:1,x:"Toyota is under Competence. Porsche and Apple are Excitement; Mercedes and Lamborghini are Sophistication; McDonald's is Sincerity."},
{t:"brand",q:"Per the slide, Nike and Levi's share which brand-personality dimension?",o:["Excitement","Competence","Ruggedness","Sincerity"],a:2,x:"Ruggedness (outdoorsy, tough): Marlboro, Harley-Davidson, Nike, Guinness, Levi's, REI, Jeep."},
{t:"brand",q:"In the brand-identity creation framework, “mission, ethics, purpose, values” belong to which block?",o:["#01 Brand story","#02 Personality","#03 Tone of voice","#06 Communications"],a:1,x:"Brand story = value, founder, customer story. Personality = mission, ethics, purpose, values. Tone of voice = positioning, emotion, difference, relevance. Communications = guidelines, consistency, messaging, tone of voice."},
{t:"brand",q:"In the “logo → visual identity → branding” circles, which item belongs to the outer BRANDING ring rather than to visual identity?",o:["Typography","Use of space","Customer service philosophy","Imagery"],a:2,x:"Visual identity = colours, imagery, layout, typography, use of space. Branding ring = values, personality, product quality, customer service philosophy, business processes, associated brands, channels, marketing approach, networking, tone of voice."},
{t:"brand",q:"Using the “Choose the right mascot” decision tree, a dairy brand (milk → cow) should pick:",o:["A human mascot","An object mascot","An animal mascot","No mascot"],a:2,x:"Product associated with an animal → animal mascot. A real-estate service associated with a house → object. A freelancer promoting themself → human."},
{t:"brand",q:"According to the slide, brand identity was introduced by:",o:["David Aaker in 1991","Philip Kotler in 1967","Kapferer in 1970","George S. Day in 1990"],a:2,x:"The slide states Kapferer, 1970. Aaker is the source of the five brand-personality dimensions."},
{t:"brand",q:"Which is NOT one of the six components of brand equity on the class diagram?",o:["Brand association","Brand loyalty","Brand awareness","Brand architecture"],a:3,x:"The six: brand image, brand identity, brand awareness, customer perception, brand loyalty, brand association."},
{t:"brand",q:"On the psychology-of-colours wheel, “trust, security, power, success” are linked to:",o:["Green","Blue","Purple","Yellow"],a:1,x:"Blue = success, power, trust, security, confidence, purpose. Green = nature, health, prosperity, safety, harmony, loyalty, luck."},
{t:"brand",q:"Why did the course show a child falling off a bike next to a box of Band-Aid?",o:["To illustrate packaging protection","To show a brand so strong that its name replaces the category name — very high brand equity","To illustrate an object mascot","To illustrate value positioning"],a:1,x:"People say “Band-Aid” rather than “adhesive bandage”: the brand has become the generic term, an extreme form of brand equity."},
/* ---- Packaging ---- */
{t:"pack",q:"Easy-open features, portion control and freshness-preserving materials illustrate which function of packaging beyond protection?",o:["Differentiation","Value delivery","Competitive positioning","Brand promise"],a:1,x:"Value delivery = better user experience, preserved quality, convenience. Differentiation = unique shapes/colours; brand promise = trust → repeat purchase."},
{t:"pack",q:"Shoppers assume a bigger box is a better deal even when the contents are identical. Which concept explains this?",o:["Visual hierarchy","The size–value heuristic","Shelf impact","Front-of-pack architecture"],a:1,x:"Heuristics & biases: the size–value heuristic makes larger packages look like better value regardless of the actual contents."},
{t:"pack",q:"According to the packaging slide, red on a pack often creates:",o:["Trust","Calm","A sense of urgency","Luxury"],a:2,x:"“Blue often conveys trust, while red can create a sense of urgency.”"},
{t:"pack",q:"Which statement matches private-label vs national-brand design logic?",o:["Private labels use premium materials and innovation","National brands focus on cost-effective designs","National brands leverage brand equity, premium materials and standout design; private labels emphasize value and functionality","Both follow the same logic"],a:2,x:"Private labels aim for cost-effective designs for budget-conscious consumers."},
{t:"pack",q:"Packaging that helps consumers tell line extensions and sub-brands apart within a brand family serves:",o:["Portfolio architecture","Signature packaging","Visual hierarchy","Disruptive category design"],a:0,x:"Portfolio architecture differentiates line extensions and sub-brands with clear visual cues."},
{t:"pack",q:"Oatly and Method are given as examples of:",o:["Premiumization","Disruptive category design","Private-label logic","Smart packaging"],a:1,x:"They disrupted packaging norms with sustainable materials and innovative designs that communicate brand values to environmentally conscious consumers."},
{t:"pack",q:"How do market leaders and challenger brands use packaging differently?",o:["Leaders use it to differentiate in a crowded market; challengers to reinforce loyalty","Leaders use it to reinforce brand equity and loyalty; challengers use distinctive designs to differentiate, often for niche segments","Both only use it for protection","Challengers copy the leader's packaging"],a:1,x:"Market leaders: reinforce equity and loyalty. Challengers: distinctive designs to stand out, appealing to niche segments or specific preferences."},
{t:"pack",q:"QR codes, NFC chips and sensors on packs are classified as smart packaging. Besides better UX, what do they enable?",o:["Lower production cost","Tracking and authentication of products","Portion control","Premium pricing"],a:1,x:"Smart packaging gives real-time product information and enables tracking and authentication."},
{t:"pack",q:"Nutella jars printed with customers' first names are an example of:",o:["Minimalist design","AR/VR experience","Personalization strategy","Private-label logic"],a:2,x:"Personalization strategies: customized labels, unique designs, interactive elements that create a personal connection."},
{t:"pack",q:"Which is NOT one of the four functions of packaging “beyond protection”?",o:["Differentiation","Brand promise","Cost minimization","Competitive positioning"],a:2,x:"The four: differentiation, value delivery, competitive positioning, brand promise."},
{t:"pack",q:"Guiding attention to the key message through size, colour contrast and placement is called:",o:["Shelf impact","Visual hierarchy","Structural design","Category visibility"],a:1,x:"Visual hierarchy ensures key messages are noticed first, leading to better decisions at the point of purchase."},
{t:"pack",q:"Minimalist and transparent packaging especially resonates with consumers seeking:",o:["Status and luxury","Authenticity and sustainability","Low prices","Novelty and fun"],a:1,x:"Fewer materials and clear labelling enhance perceived quality and appeal to consumers seeking authenticity and sustainability."}
];

/* ======================= HELPERS ======================= */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("mkt-known",[]));
const ALL=[];BR.forEach(b=>b.nodes.forEach(n=>{n.b=b;ALL.push(n)}));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ");
ALL.forEach(n=>n.txt=(n.t+" "+strip(n.h)).toLowerCase());

/* ======================= TABS ======================= */
function show(view){
  const isMap=view!=="quiz";
  $("#view-map").hidden=!isMap;$("#view-quiz").hidden=isMap;
  $("#tab-map").setAttribute("aria-selected",isMap);$("#tab-quiz").setAttribute("aria-selected",!isMap);
  if(isMap)requestAnimationFrame(layout);else closeDrawer();
}
$("#tab-map").onclick=()=>{location.hash="map";};
$("#tab-quiz").onclick=()=>{location.hash="quiz";};
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));

/* ======================= MAP RENDER ======================= */
function render(){
  const L=$("#sideL"),R=$("#sideR");
  BR.forEach(b=>{
    const row=document.createElement("div");row.className="br-row";row.dataset.b=b.id;
    row.style.setProperty("--bc",`var(--${b.c})`);row.style.setProperty("--bt",`var(--${b.c}-t)`);
    const bn=document.createElement("button");bn.className="br-node";bn.setAttribute("aria-expanded","true");
    bn.innerHTML=`<span class="wk">${b.week}</span><span class="bt">${b.name}</span><span class="cnt">${b.nodes.length} topics · click to fold</span>`;
    bn.onclick=()=>{row.classList.toggle("collapsed");bn.setAttribute("aria-expanded",!row.classList.contains("collapsed"));layout();};
    const kids=document.createElement("div");kids.className="kids";
    b.nodes.forEach(n=>{
      const k=document.createElement("button");k.className="leaf";k.dataset.id=n.id;
      k.innerHTML=`<span class="imp i${n.imp}"><i></i><i></i><i></i></span><span class="lt">${n.t}</span><span class="ok">✓</span>`;
      k.onclick=()=>openNode(n);n.el=k;kids.append(k);
    });
    row.append(bn,kids);(b.side==="L"?L:R).append(row);b.row=row;
  });
  refreshKnown();
}
function refreshKnown(){
  ALL.forEach(n=>n.el&&n.el.classList.toggle("known",known.has(n.id)));
  $("#prog").textContent=`${known.size} / ${ALL.length} topics marked as known`;
}
let mode="two";
function layout(){
  const mm=$("#mm");if($("#view-map").hidden)return;
  const w=$(".mm-scroll").clientWidth;
  const m=w>=1180?"two":(w>=760?"one":"outline");
  if(m!==mode){mm.classList.remove(mode);mm.classList.add(m);mode=m;}
  drawLines();
}
function drawLines(){
  const svg=$("#lines"),mm=$("#mm");
  if(mode==="outline"){svg.innerHTML="";return;}
  const W=mm.getBoundingClientRect();
  svg.setAttribute("width",mm.offsetWidth);svg.setAttribute("height",mm.offsetHeight);
  const root=$(".root").getBoundingClientRect();
  const rel=r=>({l:r.left-W.left,r:r.right-W.left,cy:r.top-W.top+r.height/2,cx:r.left-W.left+r.width/2});
  const R=rel(root);let p="";
  const curve=(x1,y1,x2,y2,col,wd,op)=>{const dx=(x2-x1)/2;return `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" style="stroke:var(--${col})" stroke-width="${wd}" stroke-linecap="round" opacity="${op}"/>`;};
  BR.forEach(b=>{
    const bnR=rel(b.row.querySelector(".br-node").getBoundingClientRect());
    const left=bnR.cx<R.cx;
    p+=left?curve(R.l,R.cy,bnR.r,bnR.cy,b.c,3,.9):curve(R.r,R.cy,bnR.l,bnR.cy,b.c,3,.9);
    if(b.row.classList.contains("collapsed"))return;
    b.nodes.forEach(n=>{const k=rel(n.el.getBoundingClientRect());
      p+=left?curve(bnR.l,bnR.cy,k.r,k.cy,b.c,1.5,.55):curve(bnR.r,bnR.cy,k.l,k.cy,b.c,1.5,.55);});
  });
  svg.innerHTML=p;
}
window.addEventListener("resize",layout);
if(window.ResizeObserver)new ResizeObserver(()=>drawLines()).observe($("#mm"));
if(document.fonts)document.fonts.ready.then(layout);

/* filters */
let minImp=1;
function applyFilter(){
  const q=$("#q").value.trim().toLowerCase();
  BR.forEach(b=>{let any=false;b.nodes.forEach(n=>{
    const okImp=n.imp>=minImp, okQ=!q||n.txt.includes(q);
    n.el.classList.toggle("dim",!(okImp&&okQ));n.el.classList.toggle("hit",!!q&&okQ&&okImp);if(okImp&&okQ)any=true;});
    b.row.classList.toggle("dim",!any);
    if(q&&any)b.row.classList.remove("collapsed");
  });drawLines();
}
$("#q").addEventListener("input",applyFilter);
document.querySelectorAll("#impf .chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll("#impf .chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  c.setAttribute("aria-pressed","true");minImp=+c.dataset.imp;applyFilter();});
$("#toggleAll").onclick=()=>{const anyOpen=BR.some(b=>!b.row.classList.contains("collapsed"));
  BR.forEach(b=>b.row.classList.toggle("collapsed",anyOpen));$("#toggleAll").textContent=anyOpen?"Expand all":"Collapse all";layout();};

/* drawer */
let cur=null;
function openNode(n){
  cur=n;document.querySelectorAll(".leaf.active").forEach(e=>e.classList.remove("active"));n.el.classList.add("active");
  const d=$("#drawer");d.style.setProperty("--bc",`var(--${n.b.c})`);d.style.setProperty("--bt",`var(--${n.b.c}-t)`);
  $("#drHead").innerHTML=`<div class="dr-meta"><span>${n.b.name}</span><span class="imp i${n.imp}"><i></i><i></i><i></i></span><span>${IMPNAME[n.imp]}</span></div><h3>${n.t}</h3>`;
  $("#drBody").innerHTML=n.h;$("#drBody").scrollTop=0;
  const sib=n.b.nodes,i=sib.indexOf(n);
  $("#drFoot").innerHTML=`<div style="display:flex;gap:8px"><button class="btn" id="prev" ${i?"":"disabled"}>← Prev</button><button class="btn" id="next" ${i<sib.length-1?"":"disabled"}>Next →</button></div><button class="btn ${known.has(n.id)?"":"primary"}" id="kn">${known.has(n.id)?"Known ✓ (undo)":"Mark as known"}</button>`;
  $("#prev").onclick=()=>openNode(sib[i-1]);$("#next").onclick=()=>openNode(sib[i+1]);
  $("#kn").onclick=()=>{known.has(n.id)?known.delete(n.id):known.add(n.id);store.set("mkt-known",[...known]);refreshKnown();openNode(n);};
  d.hidden=false;$("#scrim").hidden=false;
}
function openTraps(){
  cur=null;const d=$("#drawer");d.style.setProperty("--bc","var(--warn)");d.style.setProperty("--bt","var(--warn-t)");
  $("#drHead").innerHTML=`<div class="dr-meta"><span>Last-minute revision</span></div><h3>Every exam trap in one list</h3>`;
  let h="";BR.forEach(b=>{const t=[];b.nodes.forEach(n=>{const m=n.h.match(/<div class="trap">([\s\S]*?)<\/div>/g);if(m)m.forEach(x=>t.push(`<div class="trap"><b>${n.t}:</b> ${x.replace(/<\/?div[^>]*>/g,"")}</div>`));});
    if(t.length)h+=`<h4 style="color:var(--${b.c})">${b.name}</h4>`+t.join("");});
  $("#drBody").innerHTML=h;$("#drBody").scrollTop=0;$("#drFoot").innerHTML=`<span class="progress">Read this list right before the exam.</span>`;
  d.hidden=false;$("#scrim").hidden=false;
}
$("#traps").onclick=openTraps;
function closeDrawer(){$("#drawer").hidden=true;$("#scrim").hidden=true;document.querySelectorAll(".leaf.active").forEach(e=>e.classList.remove("active"));}
$("#drx").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ======================= QUIZ ======================= */
const qs={topic:"all",size:"all",pool:[],i:0,score:0,ans:[]};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function setup(){
  const counts={};Q.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  const best=store.get("mkt-best",null);
  $("#qz").innerHTML=`<div class="qz-setup">
   <div><h2>Hard quiz — ${Q.length} exam-style questions</h2><p style="margin:6px 0 0;color:var(--muted)">Distractors are built from the slides' own wording, so near-misses are wrong. Every answer comes with the reason and the trap.</p></div>
   <div class="row"><span class="lbl">Topic</span><div class="chips" id="qtopic">
     <button class="chip" data-t="all" aria-pressed="true">All topics (${Q.length})</button>
     ${Object.keys(TOPICS).map(t=>`<button class="chip" data-t="${t}" aria-pressed="false">${TOPICS[t]} (${counts[t]||0})</button>`).join("")}
   </div></div>
   <div class="row"><span class="lbl">Length</span><div class="chips" id="qsize">
     <button class="chip" data-s="all" aria-pressed="true">Every question</button>
     <button class="chip" data-s="20" aria-pressed="false">Exam sprint · 20 random</button>
     <button class="chip" data-s="10" aria-pressed="false">Quick 10</button>
   </div></div>
   <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="go" style="padding:11px 22px;font-size:15px">Start quiz</button>
   ${best!==null?`<span class="score">Best full-quiz score: ${best}%</span>`:""}</div></div>`;
  const pick=(sel,key,attr)=>document.querySelectorAll(sel+" .chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(sel+" .chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");qs[key]=c.dataset[attr];});
  pick("#qtopic","topic","t");pick("#qsize","size","s");qs.topic="all";qs.size="all";
  $("#go").onclick=()=>start();
}
function start(list){
  let pool=list||Q.filter(q=>qs.topic==="all"||q.t===qs.topic);
  pool=shuffle(pool);if(!list&&qs.size!=="all")pool=pool.slice(0,+qs.size);
  qs.pool=pool.map(q=>{const order=shuffle(q.o.map((_,k)=>k));return {...q,order};});
  qs.i=0;qs.score=0;qs.ans=[];qs.full=!list&&qs.topic==="all"&&qs.size==="all";renderQ();
}
function renderQ(){
  const q=qs.pool[qs.i],n=qs.pool.length;
  $("#qz").innerHTML=`<div class="qcard" style="--bc:var(--${TOPC[q.t]});--bt:var(--${TOPC[q.t]}-t)">
   <div class="qtop"><span class="qtag">${TOPICS[q.t]}</span><span class="score">Q ${qs.i+1} / ${n} · score ${qs.score}</span></div>
   <div class="bar"><i style="width:${qs.i/n*100}%"></i></div>
   <p class="qtext">${q.q}</p>
   <div class="opts">${q.order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCDE"[j]}</span><span>${q.o[k]}</span></button>`).join("")}</div>
   <div id="fb"></div>
   <div class="qnav"><button class="btn" id="quit">End quiz</button><button class="btn primary" id="nx" hidden>${qs.i<n-1?"Next question →":"See results"}</button></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#quit").onclick=results;$("#nx").onclick=()=>{qs.i++;qs.i<n?renderQ():results();};
  window.scrollTo({top:$("#qz").offsetTop-10,behavior:"smooth"});
}
function answer(k){
  const q=qs.pool[qs.i],ok=k===q.a;if(ok)qs.score++;qs.ans.push({q,k,ok});
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.a)b.classList.add("right");else if(kk===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`<div class="expl ${ok?"ok":"ko"}"><strong>${ok?"Correct":"Not quite — correct answer: "+q.o[q.a]}</strong>${q.x}</div>`;
  $("#nx").hidden=false;$("#nx").focus();
}
function results(){
  const a=qs.ans,n=a.length;
  if(!n){setup();return;}
  const pct=Math.round(qs.score/n*100);
  if(qs.full&&n===qs.pool.length){const b=store.get("mkt-best",0);if(pct>b)store.set("mkt-best",pct);}
  const by={};a.forEach(x=>{by[x.q.t]=by[x.q.t]||[0,0];by[x.q.t][1]++;if(x.ok)by[x.q.t][0]++;});
  const miss=a.filter(x=>!x.ok);
  const verdict=pct>=85?"Exam-ready on this set.":pct>=65?"Solid, but review the misses below.":"Go back to the map for the red topics, then retry.";
  $("#qz").innerHTML=`<div class="qcard res"><span class="lbl">Result</span><div class="big">${pct}%</div><p style="margin:6px 0 0">${qs.score} / ${n} correct. ${verdict}</p>
   <div class="topicbars">${Object.keys(by).map(t=>{const [g,m]=by[t];return `<div class="tbar" style="--bc:var(--${TOPC[t]})"><span>${TOPICS[t]}</span><span class="t"><i style="width:${g/m*100}%"></i></span><span class="n">${g}/${m}</span></div>`}).join("")}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${miss.length?`<button class="btn primary" id="retry">Retry the ${miss.length} missed</button>`:""}<button class="btn" id="again">New quiz</button></div>
   ${miss.length?`<h3 style="margin:20px 0 6px;font-size:18px">Review your misses</h3>`+miss.map(x=>`<div class="miss"><div class="mq">${x.q.q}</div><div>Your answer: ${x.q.o[x.k]}</div><div class="ma">Correct: ${x.q.o[x.q.a]}</div><div style="color:var(--muted);margin-top:4px">${x.q.x}</div></div>`).join(""):""}</div>`;
  if(miss.length)$("#retry").onclick=()=>start(miss.map(x=>{const {order,...r}=x.q;return r;}));
  $("#again").onclick=setup;
}

/* boot */
render();setup();show(location.hash.slice(1)||"map");layout();
</script>
