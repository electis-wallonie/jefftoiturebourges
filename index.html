<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision Current Issues in Logistics</title>
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;
  --c1:#2f6fd6;--c2:#b0442f;--c3:#2f8a57;--c4:#8a4fc2;
  --ok:#2f8a57;--ko:#c0392b;--okbg:#e6f4ec;--kobg:#fbe9e7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#1f1f1d;--ink:#ecebe6;--muted:#a3a19a;--line:#33322f;
  --c1:#6c9cf0;--c2:#e07a63;--c3:#5cc08a;--c4:#b48be6;
  --ok:#5cc08a;--ko:#ef7b6e;--okbg:#1d3326;--kobg:#3a1f1c;}}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1f1f1d;--ink:#ecebe6;--muted:#a3a19a;--line:#33322f;
  --c1:#6c9cf0;--c2:#e07a63;--c3:#5cc08a;--c4:#b48be6;
  --ok:#5cc08a;--ko:#ef7b6e;--okbg:#1d3326;--kobg:#3a1f1c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0}
h1{font-size:18px;margin:0;flex:1;min-width:200px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:inherit}
.view{display:none;padding:20px 0 60px}.view.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
input[type=search]{flex:1;min-width:180px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
/* mind map */
.root{text-align:center;margin:4px auto 0}
.root span{display:inline-block;background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:14px;font-weight:700;font-size:17px}
.trunk{width:2px;height:18px;background:var(--line);margin:0 auto}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;border-top:2px solid var(--line);padding-top:18px}
.branch{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--bc);border-radius:12px;padding:12px 12px 14px}
.branch h2{margin:0 0 2px;font-size:16px;color:var(--bc)}
.branch .who{font-size:12px;color:var(--muted);margin-bottom:10px}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:9px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--bc) 35%,transparent)}
li.n{margin:3px 0}
.lbl{display:flex;gap:6px;align-items:flex-start;cursor:default;padding:3px 6px;border-radius:6px}
.has>.lbl{cursor:pointer;font-weight:600}
.has>.lbl:hover{background:color-mix(in srgb,var(--bc) 10%,transparent)}
.car{flex:none;width:14px;color:var(--bc);transition:transform .15s;font-size:11px;margin-top:3px}
.has.open>.lbl .car{transform:rotate(90deg)}
.has:not(.open)>ul{display:none}
.leaf>.lbl .car::before{content:"•"}
.note{display:block;font-weight:400;color:var(--muted);font-size:13px}
.hl{background:#ffe58a;color:#1d1d1b;border-radius:3px}
.key{font-weight:700;color:var(--bc)}
li.hide{display:none}
/* cheat */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{white-space:nowrap;font-weight:700;width:1%}
.trap li{margin:6px 0}
/* quiz */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.qtext{font-size:17px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 14px;border-radius:10px;margin:8px 0;cursor:pointer;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border-left:4px solid var(--muted);font-size:14px;display:none}
.expl.show{display:block}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.primary{background:var(--ink);color:var(--bg);border:none;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.score{font-size:40px;font-weight:800;text-align:center;margin:8px 0}
.res td:first-child{white-space:normal}
@media (max-width:600px){h1{font-size:16px}.qcard{padding:14px}}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1>ITR313 · Current Issues in Logistics — Révision</h1>
  <div class="tabs">
    <button class="tab on" data-v="map">Mind map</button>
    <button class="tab" data-v="cheat">Fiche dates & chiffres</button>
    <button class="tab" data-v="quiz">Quiz</button>
  </div>
</div></header>

<main class="wrap">
<!-- MIND MAP -->
<section id="map" class="view on">
  <div class="tools">
    <input type="search" id="search" placeholder="Chercher un mot-clé (ex : CBAM, deployer, MVP…)">
    <button class="btn" id="openAll">Tout déplier</button>
    <button class="btn" id="closeAll">Tout replier</button>
  </div>
  <div class="root"><span>Current Issues in Logistics</span></div>
  <div class="trunk"></div>
  <div class="branches" id="branches"></div>
</section>

<!-- CHEAT SHEET -->
<section id="cheat" class="view">
  <div class="cheat" id="cheatGrid"></div>
</section>

<!-- QUIZ -->
<section id="quiz" class="view">
  <div class="tools">
    <div class="chips" id="topicChips"></div>
    <button class="btn" id="restart">↻ Recommencer (mélangé)</button>
  </div>
  <div id="quizBox"></div>
</section>
</main>

/* ============ MIND MAP RENDER ============ */
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function nodeHTML(n){
  const [l,note,kids]=n;
  const has=kids&&kids.length;
  let h=`<li class="n ${has?'has':'leaf'}" data-txt="${esc((l+' '+(note||'')).toLowerCase())}"><div class="lbl"><span class="car">${has?'▶':''}</span><span><span class="t">${esc(l)}</span>${note?`<span class="note">${esc(note)}</span>`:''}</span></div>`;
  if(has)h+=`<ul>${kids.map(nodeHTML).join('')}</ul>`;
  return h+'</li>';
}
$('#branches').innerHTML=MAP.map(b=>`<div class="branch" style="--bc:var(${b.color})"><h2>${esc(b.title)}</h2><div class="who">${esc(b.who)}</div><ul class="tree">${b.nodes.map(nodeHTML).join('')}</ul></div>`).join('');
document.querySelectorAll('.branch>ul.tree>li.has').forEach(li=>li.classList.add('open'));
$('#branches').addEventListener('click',e=>{const l=e.target.closest('.has>.lbl');if(l)l.parentElement.classList.toggle('open')});
$('#openAll').onclick=()=>document.querySelectorAll('li.has').forEach(l=>l.classList.add('open'));
$('#closeAll').onclick=()=>document.querySelectorAll('li.has').forEach(l=>l.classList.remove('open'));
const origHTML=new Map();
document.querySelectorAll('.lbl > span:last-child').forEach(s=>origHTML.set(s,s.innerHTML));
$('#search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  origHTML.forEach((h,s)=>s.innerHTML=h);
  const all=[...document.querySelectorAll('li.n')];
  if(!q){all.forEach(l=>l.classList.remove('hide'));return}
  all.forEach(l=>l.classList.add('hide'));
  all.forEach(l=>{
    if(l.dataset.txt.includes(q)){
      l.classList.remove('hide');
      l.querySelectorAll('li.n').forEach(c=>c.classList.remove('hide'));
      let p=l.parentElement.closest('li.n');
      while(p){p.classList.remove('hide');p.classList.add('open');p=p.parentElement.closest('li.n')}
      const s=l.querySelector(':scope>.lbl>span:last-child');
      const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      s.querySelectorAll('.t,.note').forEach(x=>x.innerHTML=x.innerHTML.replace(re,'<mark class="hl">$1</mark>'));
    }
  });
});

/* ============ QUIZ ============ */
let topic='all',deck=[],idx=0,answers=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chips(){
  const counts={all:Q.length};Q.forEach(q=>counts[q[0]]=(counts[q[0]]||0)+1);
  const opts=[['all','Tous']].concat(Object.entries(T));
  $('#topicChips').innerHTML=opts.map(([k,v])=>`<button class="chip ${k===topic?'on':''}" data-k="${k}">${v} (${counts[k]})</button>`).join('');
  $('#topicChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{topic=c.dataset.k;start()});
}
function start(list){
  chips();
  const base=list||Q.filter(q=>topic==='all'||q[0]===topic);
  deck=shuffle(base).map(q=>({q,order:shuffle([0,1,2,3])}));
  idx=0;answers=new Array(deck.length).fill(null);render();
}
function render(){
  if(idx>=deck.length)return results();
  const {q,order}=deck[idx],a=answers[idx];
  const done=answers.filter(x=>x!==null).length,good=answers.filter(x=>x===0).length;
  $('#quizBox').innerHTML=`<div class="qcard">
   <div class="qmeta"><span>Question ${idx+1} / ${deck.length}</span><span>Score : ${good} / ${done}</span></div>
   <div class="bar"><i style="width:${idx/deck.length*100}%"></i></div>
   <span class="tag" style="background:var(${TC[q[0]]})">${T[q[0]]}</span>
   <div class="qtext" style="margin-top:10px">${esc(q[1])}</div>
   ${order.map(o=>`<button class="opt ${a!==null?(o===0?'good':(o===a?'bad':'')):''}" data-o="${o}" ${a!==null?'disabled':''}>${esc(q[2][o])}</button>`).join('')}
   <div class="expl ${a!==null?'show':''}" style="border-color:var(${a===0?'--ok':'--ko'})"><b>${a===0?'✓ Correct':'✗ Réponse : '+esc(q[2][0])}</b><br>${esc(q[3])}</div>
   <div class="nav"><button class="btn" id="prev" ${idx===0?'disabled':''}>← Précédent</button>
   <button class="primary" id="next" ${a===null?'style="opacity:.4" disabled':''}>${idx===deck.length-1?'Voir le résultat':'Suivant →'}</button></div></div>`;
  $('#quizBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.o;render()});
  $('#prev').onclick=()=>{idx--;render()};
  $('#next').onclick=()=>{idx++;render()};
}
function results(){
  const good=answers.filter(x=>x===0).length,pct=Math.round(good/deck.length*100);
  const by={};deck.forEach((d,i)=>{const k=d.q[0];by[k]=by[k]||[0,0];by[k][1]++;if(answers[i]===0)by[k][0]++});
  const wrong=deck.filter((d,i)=>answers[i]!==0).map(d=>d.q);
  $('#quizBox').innerHTML=`<div class="qcard"><div style="text-align:center;color:var(--muted)">Résultat</div>
   <div class="score">${good} / ${deck.length} · ${pct}%</div>
   <p style="text-align:center">${pct>=85?'Excellent, tu es prêt.':pct>=65?'Bien — revois les erreurs ci-dessous.':'Repasse sur la mind map pour les thèmes faibles, puis refais les erreurs.'}</p>
   <table class="res">${Object.entries(by).map(([k,v])=>`<tr><td><span class="tag" style="background:var(${TC[k]})">${T[k]}</span></td><td>${v[0]} / ${v[1]}</td></tr>`).join('')}</table>
   ${wrong.length?`<h3 style="margin:18px 0 6px;font-size:15px">À revoir</h3><ul class="trap">${wrong.map(q=>`<li><b>${esc(q[1])}</b><br>→ ${esc(q[2][0])}</li>`).join('')}</ul>`:''}
   <div class="nav">${wrong.length?'<button class="primary" id="redo">Refaire uniquement les erreurs</button>':'<span></span>'}<button class="btn" id="again">Tout recommencer</button></div></div>`;
  if(wrong.length)$('#redo').onclick=()=>start(wrong);
  $('#again').onclick=()=>start();
}
$('#restart').onclick=()=>start();
start();
</script>
</body>
</html>
